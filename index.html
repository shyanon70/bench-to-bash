<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101A24">
<meta name="description" content="Daily shell, HPC, Git and genomics-workflow practice for bioinformatics beginners.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bench to Bash">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Bench to Bash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: module rail on the left (top scroller on phones), one focused practice card at a time; terminal panes stay dark in both themes. */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --sunk:#E3E9EF; --ink:#14202C; --muted:#566576; --line:#D2DAE3;
  --accent:#1D5BC4; --accent-ink:#FFFFFF; --accent-soft:#DCE7FA;
  --A:#23855A; --C:#2563C9; --G:#B97C06; --T:#C2433A; --N:#B4BFCB;
  --ok:#1E7D4F; --ok-soft:#DDF2E6; --bad:#B8382E; --bad-soft:#FBE4E1; --warn-soft:#FFF1D6;
  --term-bg:#101A24; --term-fg:#D9E4EE; --term-dim:#7E91A3; --term-prompt:#7FD1B0; --term-line:#22313F;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D131A; --surface:#151D26; --sunk:#1B2530; --ink:#E2E9F0; --muted:#94A3B3; --line:#263342;
  --accent:#6FA2F2; --accent-ink:#0D131A; --accent-soft:#1D2D45;
  --A:#4FC08A; --C:#6FA2F2; --G:#E2AE3E; --T:#EE7D72; --N:#3E4B59;
  --ok:#5BCB92; --ok-soft:#173326; --bad:#F08C80; --bad-soft:#3A1E1C; --warn-soft:#3A2E14;
  --term-bg:#080D12; --term-line:#1C2834; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131A; --surface:#151D26; --sunk:#1B2530; --ink:#E2E9F0; --muted:#94A3B3; --line:#263342;
  --accent:#6FA2F2; --accent-ink:#0D131A; --accent-soft:#1D2D45;
  --A:#4FC08A; --C:#6FA2F2; --G:#E2AE3E; --T:#EE7D72; --N:#3E4B59;
  --ok:#5BCB92; --ok-soft:#173326; --bad:#F08C80; --bad-soft:#3A1E1C; --warn-soft:#3A2E14;
  --term-bg:#080D12; --term-line:#1C2834; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
button{font:inherit;color:inherit}
code,kbd,pre,textarea,.mono{font-family:var(--f-mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}

.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 8px 16px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.brand span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.navlist{display:flex;flex-direction:column;gap:2px}
.navbtn{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:8px;padding:8px;cursor:pointer}
.navbtn:hover{background:var(--sunk)}
.navbtn[aria-current="true"]{background:var(--accent-soft)}
.navbtn .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center}
.navbtn .t{font-size:14.5px;line-height:1.3}
.navbtn .mini{display:block;margin-top:4px}
.navsec{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:16px 8px 6px}

main{padding-inline:clamp(16px,4vw,48px);padding-block:28px 64px;min-width:0}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

.read{display:inline-flex;flex-wrap:wrap;gap:1px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.02em}
.read i{font-style:normal;color:var(--N)}
.read i.A{color:var(--A)}.read i.C{color:var(--C)}.read i.G{color:var(--G)}.read i.T{color:var(--T)}

.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.lede{color:var(--muted);max-width:65ch;margin:0}
.hero h1{font-size:clamp(30px,4.6vw,46px);font-weight:800;letter-spacing:-.02em;margin:6px 0 10px}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--accent)}

.plan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.plan>div{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.plan>div:last-child{border-right:0}
.plan .min{font-family:var(--f-mono);font-size:13px;color:var(--accent);font-weight:600}
.plan h3{font-size:16px;margin:4px 0}
.plan p{margin:0;font-size:14px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;cursor:pointer;font-size:15px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.small{padding:6px 10px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.modcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.modcard:hover{border-color:var(--accent)}
.modcard .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.modcard h3{font-size:17px}
.modcard p{margin:0;font-size:14px;color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;font-weight:700;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}

.lessons{display:flex;flex-direction:column;gap:14px}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px}
.lesson h3{font-size:18px;margin-bottom:6px}
.lesson .when{margin:0;font-size:15px}
.lesson .when b{color:var(--accent)}
.lesson .watch{margin:8px 0 0;font-size:14px;color:var(--muted)}
.lesson .watch b{color:var(--T)}
pre.code{margin:0;background:var(--term-bg);color:var(--term-fg);border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.6;overflow-x:auto;white-space:pre}
pre.code .c{color:var(--term-dim)}
pre.code .p{color:var(--term-prompt)}

.lab{border:1px dashed var(--accent);border-radius:var(--r);padding:16px 18px;background:var(--accent-soft)}
.lab h3{font-size:17px;margin-bottom:6px}
.lab ol{margin:0;padding-left:20px}

/* practice card */
.prac{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prac-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--sunk)}
.strip{display:flex;flex-wrap:wrap;gap:3px}
.strip button{width:26px;height:26px;border-radius:5px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-weight:600;font-size:13px;cursor:pointer;color:var(--N);padding:0}
.strip button.A{color:var(--A)}.strip button.C{color:var(--C)}.strip button.G{color:var(--G)}.strip button.T{color:var(--T)}
.strip button.done{color:#fff;border-color:transparent}
.strip button.done.A{background:var(--A)}.strip button.done.C{background:var(--C)}.strip button.done.G{background:var(--G)}.strip button.done.T{background:var(--T)}
:root[data-theme="dark"] .strip button.done{color:#0D131A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .strip button.done{color:#0D131A}}
.strip button.cur{outline:2px solid var(--ink);outline-offset:1px}
.prac-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.kind{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.q{font-size:18px;margin:0;max-width:65ch}
.q code,.fb code,.when code,.watch code,.lab code,.cheat code,p code{background:var(--sunk);padding:1px 5px;border-radius:4px;font-size:.88em}
.term{background:var(--term-bg);color:var(--term-fg);border-radius:8px;padding:12px 14px;font-family:var(--f-mono);font-size:14px;min-width:0}
.term .ctx{color:var(--term-dim);white-space:pre-wrap;margin-bottom:6px}
.term .line{display:flex;gap:8px;align-items:center}
.term .ps{color:var(--term-prompt);white-space:nowrap;flex-shrink:0}
.term input{flex:1;min-width:0;background:transparent;border:0;color:var(--term-fg);font:inherit;font-size:15px;caret-color:var(--term-prompt);padding:4px 0}
.term input:focus{outline:none}
.term:focus-within{box-shadow:0 0 0 2px var(--accent)}
textarea.script{width:100%;min-height:220px;background:var(--term-bg);color:var(--term-fg);border:0;border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.6;resize:vertical;caret-color:var(--term-prompt)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;font-size:15px}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.fb{border-radius:8px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.no{background:var(--bad-soft);border-left:4px solid var(--bad)}
.fb.hint{background:var(--warn-soft);border-left:4px solid var(--G)}
.fb.show{background:var(--sunk);border-left:4px solid var(--muted)}
.fb p{margin:0}.fb p+p,.fb pre{margin-top:8px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.checks li::before{content:"✗ ";color:var(--bad);font-weight:700}
.checks li.pass::before{content:"✓ ";color:var(--ok)}
.prac-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.small-note{font-size:13px;color:var(--muted)}

.cheat{display:flex;flex-direction:column;gap:22px}
.cheat table{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.cheat th,.cheat td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.cheat th{background:var(--sunk);font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.cheat td.mono{white-space:nowrap}
.cheat h2{font-size:22px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:9}


.tutor{border-top:1px solid var(--line);background:var(--sunk);padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.tutor.lone{border:1px solid var(--line);border-radius:var(--r);margin-top:16px}
.tutor-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline}
.tutor-name{font-family:var(--f-display);font-weight:700;font-size:16px}
.tlog{display:flex;flex-direction:column;gap:10px}
.tlog:empty{display:none}
.msg{border-radius:8px;padding:10px 12px;font-size:15px;min-width:0;background:var(--surface);border:1px solid var(--line)}
.msg.you{background:var(--accent-soft);border-color:transparent;align-self:flex-end;max-width:90%;white-space:pre-wrap}
.msg .who{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:4px}
.msg p{margin:0}.msg p+p,.msg p+pre,.msg pre+p,.msg ul+p,.msg p+ul{margin-top:8px}
.msg ul{margin:6px 0 0;padding-left:20px}
.msg pre.code{margin:8px 0 0}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.tin{display:flex;flex-direction:column;gap:8px}
.tin textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px;padding:8px 10px;resize:vertical}
.offline{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--surface)}
.offline p{margin:0;max-width:72ch}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}
  .brand{padding:0 4px 8px}
  .navsec{display:none}
  .navlist{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .navbtn{grid-template-columns:auto;white-space:nowrap;padding:6px 10px}
  .navbtn .k,.navbtn .mini{display:none}
  .lesson{grid-template-columns:minmax(0,1fr)}
  .plan{grid-template-columns:repeat(2,minmax(0,1fr))}
  .plan>div:nth-child(2){border-right:0}
  .plan>div:nth-child(-n+2){border-bottom:1px solid var(--line)}
}
@media (max-width:480px){.stats{grid-template-columns:minmax(0,1fr)}.plan{grid-template-columns:minmax(0,1fr)}.plan>div{border-right:0;border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav class="rail" aria-label="Modules">
    <div class="brand"><b>Bench to Bash</b><span>v1</span></div>
    <div class="navlist" id="nav"></div>
  </nav>
  <main><div class="wrap" id="view"></div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============================== CONTENT ============================== */
// Exercise types: cmd (one line, checked by regex), mcq, script (multi-line, checklist)
// has(): every pattern must match somewhere, so flags can come in any order
const has=(...res)=>v=>res.every(r=>r.test(v));
const MODULES = [
{id:'nav', title:'Moving around', blurb:'pwd, ls, cd, paths, mkdir -p',
 lessons:[
  {h:'pwd: where am I?', when:'Use it the moment you feel lost, after logging in, or before running anything that writes files. It prints the full path of the folder you are in.', code:'$ pwd\n/home/you/project/scripts', watch:'<code>pwd</code> is the shell version. In R it is <code>getwd()</code>. Same idea, different language.'},
  {h:'ls: what is here?', when:'Use <code>ls</code> to list files, <code>ls -lh</code> to also see sizes in KB/MB/GB (great for checking FASTQ/BAM sizes), <code>ls -a</code> to show hidden files like <code>.bashrc</code>.', code:'$ ls -lh data/\n-rw-r--r-- 1 you lab 1.2G S1_R1.fastq.gz\n-rw-r--r-- 1 you lab 1.3G S1_R2.fastq.gz', watch:'A 0-byte output file usually means a step failed. <code>ls -lh</code> catches that fast.'},
  {h:'cd: change directory', when:'<code>cd folder</code> goes into a folder. <code>cd ..</code> goes up one. <code>cd ../..</code> goes up two. <code>cd ~</code> or plain <code>cd</code> goes home. <code>cd -</code> jumps back to where you just were.', code:'# you are in ~/project/results/qc\n$ cd ../../data     # up two, then into data\n$ pwd\n/home/you/project/data\n$ cd -              # back to results/qc', watch:'<code>..</code> means "parent folder". <code>.</code> means "this folder".'},
  {h:'Absolute vs relative paths', when:'An <b>absolute</b> path starts with <code>/</code> and works from anywhere. A <b>relative</b> path starts from where you are now. Use absolute paths inside job scripts, because the job may start in a different folder.', code:'/scratch/you/project/data/S1.bam   # absolute\ndata/S1.bam                       # relative\n../data/S1.bam                    # relative, via parent', watch:'"No such file or directory" is very often a relative path used from the wrong folder. Run <code>pwd</code>.'},
  {h:'mkdir -p: make folders', when:'Use <code>mkdir -p</code> to create nested folders in one go. It also does not complain if the folder already exists, which makes it safe in scripts.', code:'$ mkdir -p results/alignment/bam logs', watch:'Plain <code>mkdir a/b/c</code> fails when <code>a/b</code> does not exist yet.'}
 ],
 ex:[
  {t:'cmd', q:'You just logged into the cluster. Print the folder you are currently in.', acc:[/^pwd$/], hint:'Three letters: print working directory.', ans:'pwd', why:'<code>pwd</code> = print working directory.'},
  {t:'cmd', q:'List the files in this folder with sizes in human-readable units (K, M, G).', acc:[/^ls (-[a-z]*l[a-z]*h[a-z]*|-[a-z]*h[a-z]*l[a-z]*|-l -h|-h -l)$/], hint:'Two flags on ls: one for "long" format, one for "human-readable".', ans:'ls -lh', why:'<code>-l</code> long format, <code>-h</code> human-readable sizes. Flags can be combined: <code>-lh</code>.'},
  {t:'cmd', ctx:'you@hpc:~/project/scripts$ pwd\n/home/you/project/scripts', q:'Move up one level, to <code>~/project</code>.', acc:[/^cd \.\.\/?$/, /^cd ~\/project\/?$/, /^cd \/home\/you\/project\/?$/], hint:'Two dots mean "the parent folder".', ans:'cd ..', why:'<code>cd ..</code> and <code>cd ../</code> are the same thing.'},
  {t:'cmd', ctx:'you@hpc:~/project/results/qc$', q:'Go to <code>~/project/data</code> in one command using a <b>relative</b> path.', acc:[/^cd \.\.\/\.\.\/data\/?$/], traps:[[/^cd ~|^cd \//,'That works, but it is an absolute path. Try going up with <code>..</code> twice.']], hint:'Up two levels (qc → results → project), then into data.', ans:'cd ../../data', why:'From qc: <code>..</code> is results, <code>../..</code> is project, then <code>/data</code>.'},
  {t:'cmd', q:'Create <code>results/alignment/bam</code> in one command, even though <code>results/</code> does not exist yet.', acc:[/^mkdir -p results\/alignment\/bam\/?$/], traps:[[/^mkdir results/,'Without <code>-p</code>, mkdir fails because the parent folders are missing.']], hint:'mkdir has a flag for "make parents too".', ans:'mkdir -p results/alignment/bam', why:'<code>-p</code> creates every missing parent folder and is silent if it already exists.'},
  {t:'mcq', q:'Which of these is an absolute path?', opts:['data/raw/S1.fastq.gz','../data','/scratch/you/project/data','./data'], a:2, why:'Absolute paths start at the root, <code>/</code>. The others depend on where you are standing.'},
  {t:'cmd', q:'You were in <code>~/project/results</code>, then did <code>cd /scratch/you/tmp</code>. Jump straight back to the previous folder.', acc:[/^cd -$/, /^cd ~\/project\/results\/?$/], hint:'cd plus a single dash.', ans:'cd -', why:'<code>cd -</code> toggles between your current and previous folder.'}
 ],
 lab:['Run <code>pwd</code>, then <code>cd ..</code>, then <code>pwd</code> again. Notice exactly what changed.','Build your practice project: <code>mkdir -p ~/practice/{data,scripts,results,logs}</code> and check it with <code>ls ~/practice</code>.','From inside <code>~/practice/results</code>, reach <code>~/practice/data</code> with a relative path.']
},
{id:'files', title:'Looking at files', blurb:'head, zcat, wc, cp, mv, wildcards',
 lessons:[
  {h:'head, tail, less', when:'<code>head</code> shows the top of a file (default 10 lines), <code>tail</code> the bottom. <code>less</code> opens a scrollable viewer for big files (press <code>q</code> to quit, <code>/word</code> to search). Use <code>cat</code> only for small files.', code:'$ head -n 8 S1.fastq     # first 2 reads\n$ tail -n 20 job.log     # end of a log\n$ less -S genes.gtf      # -S: no line wrap', watch:'<code>cat</code> on a 10 GB FASTQ floods your screen. Press <code>Ctrl+C</code> to stop it.'},
  {h:'Compressed files: zcat, zless', when:'Most sequencing data is <code>.gz</code>. Use <code>zcat</code> (or <code>zless</code>) to read it without unzipping to disk. Pipe it into <code>head</code>.', code:'$ zcat S1_R1.fastq.gz | head -n 4\n@A00123:8:H5:1:1101:1000:1000 1:N:0\nGATTACAGATTACA...\n+\nFFFFFFF:FFFFF...', watch:'<code>head file.gz</code> prints binary garbage. Decompress first with <code>zcat</code>. On macOS use <code>gzcat</code>.'},
  {h:'wc -l: count lines', when:'Use it to count lines: genes in a BED, rows in a count table, and (divided by 4) reads in a FASTQ.', code:'$ wc -l genes.bed\n20345 genes.bed\n$ wc -l < genes.bed     # number only\n20345', watch:''},
  {h:'cp, mv, rm', when:'<code>cp a b</code> copies, <code>cp -r</code> copies folders. <code>mv a b</code> moves or renames. <code>rm</code> deletes, with no trash can.', code:'$ cp -r raw_data backup\n$ mv S1.fq.gz S1_R1.fastq.gz\n$ rm -i old.sam          # -i asks first', watch:'Never run <code>rm -r</code> with a wildcard until you have checked it with <code>ls</code> using the same pattern.'},
  {h:'Wildcards', when:'<code>*</code> matches anything, <code>?</code> one character. Use them to act on many files at once.', code:'$ ls *.fastq.gz\n$ ls S?_R1.fastq.gz\n$ ls *_R{1,2}.fastq.gz', watch:''}
 ],
 ex:[
  {t:'cmd', q:'Show the first 8 lines (2 reads) of <code>S1.fastq</code> (not compressed).', acc:[/^head (-n ?8|-8) S1\.fastq$/, /^head S1\.fastq -n ?8$/], hint:'head with -n and a number.', ans:'head -n 8 S1.fastq', why:'Each FASTQ read is 4 lines, so 8 lines = 2 reads.'},
  {t:'cmd', q:'<code>S1.fastq.gz</code> is compressed. Show its first 4 lines without unzipping the file on disk.', acc:[/^(zcat|gzcat|gunzip -c|gzip -dc|gzip -cd) S1\.fastq\.gz \| ?head (-n ?4|-4)$/,/^(zcat|gzcat|gunzip -c|gzip -dc|gzip -cd) S1\.fastq\.gz ?\| ?head (-n ?4|-4)$/], traps:[[/^head .*\.gz/,'<code>head</code> on a .gz file shows compressed binary. Decompress with <code>zcat</code> and pipe <code>|</code> into head.'],[/^zcat S1\.fastq\.gz$/,'Close. Without head, zcat prints the entire file. Pipe it: <code>| head -n 4</code>.']], hint:'zcat the file, then pipe | into head.', ans:'zcat S1.fastq.gz | head -n 4', why:'<code>zcat</code> streams the decompressed text; <code>|</code> hands it to <code>head</code>, which stops after 4 lines.'},
  {t:'cmd', q:'Count the lines in <code>genes.bed</code>.', acc:[/^wc -l genes\.bed$/, /^cat genes\.bed ?\| ?wc -l$/, /^wc -l ?< ?genes\.bed$/], hint:'word count, with the flag for lines.', ans:'wc -l genes.bed', why:'<code>wc -l</code> counts newline characters, so one per line.'},
  {t:'cmd', q:'List only the compressed FASTQ files (ending in <code>.fastq.gz</code>) in this folder.', acc:[/^ls( -[a-z]+)? \*\.fastq\.gz$/], hint:'Use the * wildcard.', ans:'ls *.fastq.gz', why:'<code>*</code> matches any characters, so <code>*.fastq.gz</code> matches every name ending that way.'},
  {t:'cmd', q:'Copy the folder <code>raw_data/</code> (with all files inside) to a new folder <code>backup</code>.', acc:[/^cp -(r|R|a|rv|vr|Rv|av) raw_data\/? backup\/?$/], traps:[[/^cp raw_data/,'cp skips folders unless you add <code>-r</code> (recursive).']], hint:'cp needs a "recursive" flag for folders.', ans:'cp -r raw_data backup', why:'<code>-r</code> = recursive: copy the folder and everything in it.'},
  {t:'mcq', q:'When should you use <code>less</code> instead of <code>cat</code>?', opts:['When the file is small','When the file is large and you want to scroll and search','When you want to join two files','When the file is compressed'], a:1, why:'<code>less</code> shows one screen at a time and lets you search with <code>/</code>. <code>cat</code> dumps everything at once and is also used to join (con<b>cat</b>enate) files.'},
  {t:'cmd', q:'Rename <code>S1.fq.gz</code> to <code>S1_R1.fastq.gz</code>.', acc:[/^mv (-[a-z]+ )?S1\.fq\.gz S1_R1\.fastq\.gz$/], traps:[[/^cp /,'cp leaves the old file behind. Renaming is a move.'],[/^rename/,'Some systems have rename, but the universal way is mv.']], hint:'Renaming is "moving" to a new name.', ans:'mv S1.fq.gz S1_R1.fastq.gz', why:'<code>mv old new</code> renames in place.'}
 ],
 lab:['Download a tiny FASTQ (or make one with 8 lines by hand), gzip it with <code>gzip file.fastq</code>, then view it with <code>zcat file.fastq.gz | head</code>.','Try <code>head</code> directly on the .gz to see what the garbage looks like, so you recognise it later.','Use <code>less -S</code> on any GTF or BED and practise searching with <code>/</code>.']
},
{id:'vars', title:'Variables & quoting', blurb:'NAME=value, $NAME, ${NAME}, "" vs \'\', $( )',
 lessons:[
  {h:'Creating a variable', when:'Use a variable for anything you would otherwise retype: a sample name, a reference path, a thread count. Write <code>NAME=value</code> with <b>no spaces</b> around <code>=</code>.', code:'SAMPLE=S1\nREF=/refs/hg38/hg38.fa\nTHREADS=8', watch:'<code>SAMPLE = S1</code> fails: bash thinks <code>SAMPLE</code> is a command. No <code>$</code> when you <i>set</i> a variable.'},
  {h:'Using it: $ and ${ }', when:'Put <code>$</code> in front when you <i>read</i> the value. Use braces <code>${NAME}</code> whenever letters, digits or underscores come right after the name.', code:'echo $SAMPLE              # S1\necho ${SAMPLE}_R1.fastq.gz # S1_R1.fastq.gz\necho $SAMPLE_R1.fastq.gz   # .fastq.gz  (oops)', watch:'<code>$SAMPLE_R1</code> is read as a variable called <code>SAMPLE_R1</code>, which is empty. Braces fix it.'},
  {h:'Double vs single quotes', when:'<b>Double quotes</b> <code>"..."</code> keep spaces together but still expand <code>$VARS</code>. Use them around almost every variable. <b>Single quotes</b> <code>\'...\'</code> are fully literal; use them for awk programs and patterns.', code:'echo "Sample: $SAMPLE"   # Sample: S1\necho \'Sample: $SAMPLE\'   # Sample: $SAMPLE\nls "$FILE"               # safe if name has spaces', watch:'Habit to build: always write <code>"$VAR"</code> in scripts.'},
  {h:'echo: print and check', when:'Use <code>echo</code> to print messages in scripts and, most of all, to <b>check</b> a variable or a command before running it for real.', code:'echo "Aligning $SAMPLE with $THREADS threads"\necho rm *.sam     # preview what rm would get', watch:''},
  {h:'$( ): capture a command\'s output', when:'Use <code>$(command)</code> to put the output of a command into a variable or another command. <code>$(( ))</code> with two parentheses does integer math.', code:'TODAY=$(date +%F)\nN=$(wc -l < genes.bed)\necho $(( N / 2 ))', watch:'<code>$( )</code> runs a command; <code>${ }</code> reads a variable; <code>$(( ))</code> does arithmetic.'},
  {h:'export', when:'A plain variable only exists in the current shell. <code>export</code> passes it to programs and scripts you launch from there.', code:'export THREADS=8\nbash align.sh   # can now see $THREADS', watch:''}
 ],
 ex:[
  {t:'cmd', q:'Make a variable <code>SAMPLE</code> that holds the value <code>S1</code>.', acc:[/^SAMPLE=("S1"|'S1'|S1)$/], traps:[[/^SAMPLE ?= |^SAMPLE =/,'No spaces around <code>=</code>. Bash would try to run a command called SAMPLE.'],[/^\$SAMPLE/,'No <code>$</code> when setting a variable. <code>$</code> is only for reading it.'],[/^(set|var|let) /,'Bash needs no keyword. Just <code>NAME=value</code>.']], hint:'NAME=value, no spaces.', ans:'SAMPLE=S1', why:'Assignment is name, equals sign, value, all touching.'},
  {t:'cmd', q:'Print the value of <code>SAMPLE</code>.', acc:[/^echo "?\$\{?SAMPLE\}?"?$/, /^printf .*\$\{?SAMPLE\}?/], traps:[[/^echo "?SAMPLE"?$/,'That prints the word SAMPLE. Add <code>$</code> to read the value.']], hint:'echo plus $.', ans:'echo "$SAMPLE"', why:'<code>$SAMPLE</code> is replaced by its value, S1, before echo runs.'},
  {t:'cmd', q:'Using the variable, print <code>S1_R1.fastq.gz</code>.', acc:[/^echo "?\$\{SAMPLE\}_R1\.fastq\.gz"?$/, /^echo "\$SAMPLE"_R1\.fastq\.gz$/], traps:[[/\$SAMPLE_R1/,'Bash reads <code>$SAMPLE_R1</code> as one variable named SAMPLE_R1, which is empty. Wrap the name: <code>${SAMPLE}_R1</code>.']], hint:'Braces around the variable name.', ans:'echo "${SAMPLE}_R1.fastq.gz"', why:'Braces mark exactly where the name ends.'},
  {t:'mcq', q:'With <code>SAMPLE=S1</code>, what does <code>echo \'$SAMPLE\'</code> print?', opts:['S1','$SAMPLE','Nothing','An error'], a:1, why:'Single quotes are literal; nothing inside them is expanded.'},
  {t:'cmd', q:'Store today\'s date (from the <code>date</code> command) in a variable called <code>TODAY</code>.', acc:[/^TODAY="?\$\(date[^)]*\)"?$/, /^TODAY=`date[^`]*`$/], traps:[[/^TODAY=date/,'That stores the word "date". Run the command with <code>$( )</code>.'],[/^TODAY=\$\{date/,'<code>${ }</code> reads a variable. To run a command, use <code>$( )</code>.']], hint:'Command substitution: $( ).', ans:'TODAY=$(date)', why:'<code>$(date)</code> runs date and drops its output into the variable.'},
  {t:'cmd', q:'Set <code>THREADS</code> to 8 and make it visible to scripts you start from this shell, in one command.', acc:[/^export THREADS=("8"|'8'|8)$/], hint:'A keyword in front of the assignment.', ans:'export THREADS=8', why:'<code>export</code> copies the variable into the environment of child processes.'},
  {t:'mcq', q:'<code>FILE="/data/my project/reads.fq"</code> (there is a space). Which command works?', opts:['ls $FILE','ls "$FILE"','ls \'$FILE\'','ls ${FILE'], a:1, why:'Without quotes, bash splits at the space and looks for two files. Double quotes keep it one path and still expand the variable.'}
 ],
 lab:['In your terminal set <code>SAMPLE=S1</code> then try <code>echo $SAMPLE_R1</code> and <code>echo ${SAMPLE}_R1</code>. See the difference with your own eyes.','Try <code>SAMPLE = S2</code> with spaces and read the error message. You will meet it again.','Run <code>N=$(ls | wc -l); echo "There are $N files here"</code>.']
},
{id:'counts', title:'Read counting', blurb:'FASTQ ÷ 4, grep -c, samtools view -c, cut | sort | uniq -c',
 lessons:[
  {h:'Reads in a FASTQ', when:'A FASTQ record is always 4 lines (header, sequence, +, quality). Count lines, divide by 4.', code:'$ echo $(( $(zcat S1_R1.fastq.gz | wc -l) / 4 ))\n2500000\n# or with awk\n$ zcat S1_R1.fastq.gz | awk \'END{print NR/4}\'', watch:'Do not <code>grep -c "@"</code>: quality lines can also start with <code>@</code>.'},
  {h:'Sequences in a FASTA', when:'Each sequence starts with a header line beginning with <code>&gt;</code>. Count headers with <code>grep -c</code>.', code:'$ grep -c "^>" genome.fa\n25', watch:'Always quote <code>"^>"</code>. An unquoted <code>&gt;</code> is redirection: bash would overwrite a file.'},
  {h:'Reads in a BAM: samtools', when:'BAM is binary, so use samtools. <code>view -c</code> counts records; <code>-F 4</code> excludes unmapped; <code>flagstat</code> gives a full summary.', code:'$ samtools view -c S1.bam\n$ samtools view -c -F 4 S1.bam     # mapped only\n$ samtools flagstat S1.bam', watch:'<code>-f</code> keeps reads WITH a flag; <code>-F</code> removes reads with it.'},
  {h:'Columns: cut and awk', when:'Use <code>cut -f2</code> to grab tab-separated columns. Use <code>awk</code> when you need logic (filters, math). Use <code>sort | uniq -c</code> to tally values.', code:'$ cut -f1 genes.bed | sort | uniq -c\n   2034 chr1\n   1287 chr2\n$ awk \'$2 > 10\' counts.tsv     # rows with count > 10', watch:'<code>uniq</code> only merges neighbouring lines, so always <code>sort</code> first.'},
  {h:'grep: find lines', when:'<code>grep pattern file</code> prints matching lines. <code>-c</code> counts them, <code>-v</code> inverts (lines that do NOT match), <code>-w</code> whole word.', code:'$ grep -v "^#" variants.vcf | wc -l   # non-header lines\n$ grep -w "TP53" genes.gtf', watch:''}
 ],
 ex:[
  {t:'mcq', q:'A FASTQ file has 400,000 lines. How many reads?', opts:['400,000','200,000','100,000','1,600,000'], a:2, why:'4 lines per read: 400,000 / 4 = 100,000.'},
  {t:'cmd', q:'Print the number of reads in <code>S1.fastq.gz</code>.', acc:[/^echo "?\$\(\( ?\$\((zcat|gzcat|gunzip -c|gzip -dc) S1\.fastq\.gz ?\| ?wc -l ?\) ?\/ ?4 ?\)\)"?$/, /^(zcat|gzcat|gunzip -c|gzip -dc) S1\.fastq\.gz ?\| ?awk '(END ?\{ ?print NR ?\/ ?4;? ?\})'$/, /^echo \$\(\( ?\$\((zcat|gzcat) S1\.fastq\.gz ?\| ?wc -l ?\) ?\/4 ?\)\)$/], traps:[[/grep -c/,'Counting @ is unreliable: quality strings can start with @. Count lines and divide by 4.'],[/^(zcat|gzcat) S1\.fastq\.gz ?\| ?wc -l$/,'That is the number of lines. Now divide by 4 with <code>echo $(( ... / 4 ))</code>.']], hint:'echo $(( $(zcat FILE | wc -l) / 4 ))', ans:'echo $(( $(zcat S1.fastq.gz | wc -l) / 4 ))', why:'Inner <code>$( )</code> runs the count; outer <code>$(( ))</code> does the division. The awk version <code>zcat S1.fastq.gz | awk \'END{print NR/4}\'</code> also works.'},
  {t:'cmd', q:'Count the sequences in <code>genome.fa</code>.', acc:[/^grep -c (["'])\^?>\1 genome\.fa$/, /^grep -c \\\^?>|^grep -c \^\\>/], traps:[[/^grep -c \^?> /,'Danger: an unquoted <code>&gt;</code> is redirection. Bash would send output into a file named genome.fa and wipe it! Quote it: <code>"^>"</code>.']], hint:'grep -c with the quoted pattern "^>".', ans:'grep -c "^>" genome.fa', why:'<code>^</code> anchors to the start of the line; every FASTA header begins with <code>&gt;</code>.'},
  {t:'cmd', q:'Count all records in <code>aligned.bam</code>.', acc:[/^samtools view -c aligned\.bam$/], traps:[[/^wc -l .*bam/,'BAM is compressed binary; wc counts nonsense. Use samtools.']], hint:'samtools view with a count flag.', ans:'samtools view -c aligned.bam', why:'<code>-c</code> prints a count instead of the reads.'},
  {t:'cmd', q:'Count only the <b>mapped</b> reads in <code>aligned.bam</code> (exclude flag 4 = unmapped).', acc:[/^samtools view (-c -F ?4|-F ?4 -c|-cF ?4) aligned\.bam$/], traps:[[/-f ?4/,'Lowercase <code>-f 4</code> KEEPS only unmapped reads. Uppercase <code>-F</code> filters them out.']], hint:'-c plus the uppercase filter flag.', ans:'samtools view -c -F 4 aligned.bam', why:'<code>-F 4</code> drops reads that have the "unmapped" bit set.'},
  {t:'cmd', q:'<code>counts.tsv</code> is tab-separated: gene, count. Print only the second column.', acc:[/^cut -f ?2 counts\.tsv$/, /^awk (-F ?['"]?\\t['"]? )?'\{ ?print \$2;? ?\}' counts\.tsv$/], hint:'cut, field 2.', ans:'cut -f2 counts.tsv', why:'cut uses tabs by default. awk works too: <code>awk \'{print $2}\' counts.tsv</code>.'},
  {t:'cmd', q:'Column 1 of <code>genes.bed</code> is the chromosome. Count genes per chromosome.', acc:[/^cut -f ?1 genes\.bed ?\| ?sort( -V)? ?\| ?uniq -c$/, /^awk '\{ ?print \$1;? ?\}' genes\.bed ?\| ?sort( -V)? ?\| ?uniq -c$/], traps:[[/genes\.bed ?\| ?uniq -c$/,'uniq only merges neighbouring identical lines, so add <code>| sort</code> before it.'],[/uniq -c ?\| ?sort/,'Check the order: cut → sort → uniq -c.']], hint:'cut column 1 | sort | uniq -c', ans:'cut -f1 genes.bed | sort | uniq -c', why:'A classic three-step pipe: take the column, group identical values, count each group.'}
 ],
 lab:['Make a 3-read FASTQ by hand (12 lines) and confirm your counting command prints 3.','If you have any BAM, compare <code>samtools view -c</code>, <code>-c -F 4</code> and <code>flagstat</code>.','Write the gene-per-chromosome pipe step by step, adding one <code>|</code> at a time and looking at the output each time.']
},
{id:'pipes', title:'Pipes & redirection', blurb:'|  >  >>  2>  &>',
 lessons:[
  {h:'| pipe', when:'Send the output of one command straight into the next, without saving a file in between.', code:'zcat S1.fastq.gz | head -n 4\ncut -f1 genes.bed | sort | uniq -c', watch:''},
  {h:'> write, >> append', when:'<code>&gt;</code> saves output to a file and <b>overwrites</b> it. <code>&gt;&gt;</code> adds to the end. Use <code>&gt;&gt;</code> for log files you keep adding to.', code:'ls *.bam > bam_list.txt\necho "step 2 done" >> run.log', watch:'<code>&gt;</code> on an existing file erases it immediately, even if the command fails.'},
  {h:'2> errors, &> both', when:'Programs print results on <b>stdout</b> and messages/errors on <b>stderr</b>. <code>2&gt;</code> saves stderr; <code>&amp;&gt;</code> saves both into one file.', code:'bwa mem ref.fa R1.fq R2.fq > S1.sam 2> S1.bwa.log\n./qc.sh &> qc.log', watch:'Many tools (bwa, STAR) write progress to stderr, so <code>&gt;</code> alone leaves it on screen.'},
  {h:'tee', when:'Use <code>tee</code> to see output on screen AND save it to a file.', code:'./run.sh 2>&1 | tee run.log', watch:''}
 ],
 ex:[
  {t:'cmd', q:'Save a list of all <code>.bam</code> files into <code>bam_list.txt</code>.', acc:[/^ls( -1)? \*\.bam ?> ?bam_list\.txt$/], hint:'ls with a wildcard, then >.', ans:'ls *.bam > bam_list.txt', why:'<code>&gt;</code> redirects the list into a new file.'},
  {t:'cmd', q:'Add the line <code>run finished</code> to the end of <code>log.txt</code> without erasing what is already there.', acc:[/^echo ("run finished"|'run finished'|run finished) ?>> ?log\.txt$/], traps:[[/[^>]> ?log\.txt$/,'A single <code>&gt;</code> overwrites log.txt. Use <code>&gt;&gt;</code> to append.']], hint:'echo, then the append operator.', ans:'echo "run finished" >> log.txt', why:'<code>&gt;&gt;</code> appends.'},
  {t:'cmd', q:'Run <code>./align.sh</code>, sending normal output to <code>align.out</code> and errors to <code>align.err</code>.', acc:[/^\.\/align\.sh ?> ?align\.out 2> ?align\.err$/, /^\.\/align\.sh 2> ?align\.err ?> ?align\.out$/, /^\.\/align\.sh 1> ?align\.out 2> ?align\.err$/], hint:'> for stdout, 2> for stderr.', ans:'./align.sh > align.out 2> align.err', why:'Stream 1 is stdout, stream 2 is stderr; each gets its own redirect.'},
  {t:'mcq', q:'What is the difference between <code>|</code> and <code>&gt;</code>?', opts:['They are the same','| sends output to another command; > sends it to a file','| sends output to a file; > sends it to another command','| is for errors only'], a:1, why:'Pipes connect commands. Redirects connect a command to a file.'},
  {t:'cmd', q:'Count the lines in <code>variants.vcf</code> that are NOT header lines (headers start with <code>#</code>).', acc:[/^grep -v (["'])\^#\1 variants\.vcf ?\| ?wc -l$/, /^grep -(vc|cv) (["'])\^#\2 variants\.vcf$/, /^grep -v \^# variants\.vcf ?\| ?wc -l$/, /^grep -(vc|cv) \^# variants\.vcf$/], hint:'grep -v inverts the match.', ans:'grep -v "^#" variants.vcf | wc -l', why:'<code>-v</code> keeps lines that do not match <code>^#</code>, i.e. the variant records.'}
 ],
 lab:['Run <code>ls nosuchfile &gt; out.txt</code>. Is the error in out.txt? Now try <code>2&gt; err.txt</code>.','Append three lines to a log with <code>&gt;&gt;</code>, then run one <code>&gt;</code> and watch the earlier lines disappear.']
},
{id:'scripts', title:'Writing scripts', blurb:'.sh, #!/bin/bash, chmod +x, $1, loops',
 lessons:[
  {h:'What a script is', when:'A <code>.sh</code> file is just commands you would type, saved in order. Write one as soon as you run the same steps twice. The extension is a label for humans; the shebang is what matters.', code:'#!/bin/bash\nset -euo pipefail\n\nSAMPLE=$1\necho "Counting reads for $SAMPLE"', watch:''},
  {h:'The shebang: #!', when:'The first line, starting <code>#!</code>, tells the system which program runs the file. Use <code>#!/bin/bash</code> for bash, <code>#!/usr/bin/env python3</code> for Python, <code>#!/usr/bin/env Rscript</code> for R.', code:'#!/bin/bash                # bash script\n#!/usr/bin/env python3     # python script\n#!/usr/bin/env Rscript     # R script', watch:'It must be the very first line, with no space before <code>#!</code>.'},
  {h:'Make it executable, then run it', when:'<code>chmod +x</code> once. Then run with <code>./script.sh</code>. Or skip chmod and run <code>bash script.sh</code>.', code:'$ chmod +x count_reads.sh\n$ ./count_reads.sh S1.fastq.gz\n$ bash count_reads.sh S1.fastq.gz   # also fine', watch:'<code>count_reads.sh</code> without <code>./</code> gives "command not found" unless the folder is on your PATH.'},
  {h:'Arguments: $1, $2, $@', when:'Pass inputs on the command line so one script works for every sample. <code>$1</code> is the first argument, <code>$2</code> the second, <code>$@</code> all, <code>$#</code> how many.', code:'# ./align.sh S1 8\nSAMPLE=$1\nTHREADS=${2:-4}   # default 4 if not given', watch:''},
  {h:'Safety line', when:'Put <code>set -euo pipefail</code> under the shebang. The script stops at the first error, on unset variables, and on failures inside pipes, instead of carrying on with broken files.', code:'#!/bin/bash\nset -euo pipefail', watch:''},
  {h:'Loops and checks', when:'Use a <code>for</code> loop to repeat a step over files, and <code>if [ -f file ]</code> to check a file exists before using it.', code:'for fq in *_R1.fastq.gz; do\n  s=$(basename "$fq" _R1.fastq.gz)\n  echo "Processing $s"\ndone\n\nif [ ! -f "$REF" ]; then\n  echo "Missing $REF" >&2; exit 1\nfi', watch:'Spaces inside <code>[ ]</code> are required: <code>[ -f "$F" ]</code>.'}
 ],
 ex:[
  {t:'mcq', q:'What does <code>#!/bin/bash</code> on line 1 do?', opts:['It is a comment and does nothing','It tells the system to run the file with bash','It makes the file executable','It loads the bash module'], a:1, why:'The shebang picks the interpreter. You still need <code>chmod +x</code> to make it executable.'},
  {t:'cmd', q:'Type the shebang line for a bash script.', acc:[/^#! ?\/bin\/bash$/, /^#! ?\/usr\/bin\/env bash$/], traps:[[/^#\/bin/,'You need both characters: <code>#!</code>.'],[/^!#/,'Order matters: hash first, then bang: <code>#!</code>.']], hint:'#! then the path to bash.', ans:'#!/bin/bash', why:'<code>#!/usr/bin/env bash</code> is also correct; it finds bash on your PATH.'},
  {t:'cmd', q:'Make <code>count_reads.sh</code> executable.', acc:[/^chmod (\+x|u\+x|a\+x|755|775|744|700) count_reads\.sh$/], hint:'chmod with +x.', ans:'chmod +x count_reads.sh', why:'<code>+x</code> adds execute permission.'},
  {t:'cmd', q:'Run <code>count_reads.sh</code> (executable, in this folder) with <code>S1.fastq.gz</code> as the first argument.', acc:[/^\.\/count_reads\.sh S1\.fastq\.gz$/, /^bash (\.\/)?count_reads\.sh S1\.fastq\.gz$/], traps:[[/^count_reads\.sh/,'Without <code>./</code> bash only searches your PATH, not the current folder.']], hint:'./ in front.', ans:'./count_reads.sh S1.fastq.gz', why:'<code>./</code> means "the file in this folder". Inside the script that filename becomes <code>$1</code>.'},
  {t:'mcq', q:'Inside a script run as <code>./align.sh S1 8</code>, which holds <code>8</code>?', opts:['$0','$1','$2','$#'], a:2, why:'<code>$0</code> is the script name, <code>$1</code> = S1, <code>$2</code> = 8, <code>$#</code> = 2 (the count).'},
  {t:'script', q:'Write <code>count_reads.sh</code>. It takes a FASTQ.gz as the first argument, stores it in a variable <code>FQ</code>, and prints the filename and its read count.', start:'', checks:[
     [s=>/^#! ?(\/bin\/bash|\/usr\/bin\/env bash)\s*$/.test(firstLine(s)),'Line 1 is a bash shebang'],
     [/set -[a-z]*e/,'Has a safety line (set -euo pipefail)'],
     [/^\s*FQ="?\$\{?1\}?"?\s*$/m,'Stores the first argument: FQ=$1'],
     [/(zcat|gzcat|gunzip -c|gzip -dc)\s+"?\$\{?FQ\}?"?/,'Decompresses "$FQ" with zcat'],
     [/wc -l|NR/,'Counts lines (wc -l)'],
     [/\/\s*4/,'Divides by 4'],
     [/echo[^\n]*\$\{?FQ\}?/,'Echoes the filename']],
   ans:'#!/bin/bash\nset -euo pipefail\n\nFQ=$1\nN=$(( $(zcat "$FQ" | wc -l) / 4 ))\necho "$FQ: $N reads"', why:'This is the shape of almost every small bioinformatics script: shebang, safety, inputs, work, output.'},
  {t:'script', q:'Write a <code>for</code> loop over every <code>*.fastq.gz</code> in the folder that prints <code>Processing &lt;filename&gt;</code>.', start:'', checks:[
     [/for\s+(\w+)\s+in\s+\*\.fastq\.gz/,'for VAR in *.fastq.gz'],
     [/(;|\n)\s*do\b/,'do'],
     [/echo\s+"?Processing \$\{?\w+\}?/,'echo "Processing $VAR"'],
     [/\bdone\b/,'done']],
   ans:'for f in *.fastq.gz; do\n  echo "Processing $f"\ndone', why:'for … in … ; do … ; done. Each pass, <code>$f</code> holds one filename.'}
 ],
 lab:['Write <code>count_reads.sh</code> for real, <code>chmod +x</code> it, and run it on your test FASTQ.','Remove the shebang and <code>chmod +x</code> and see what happens. Then put it back.','Add a loop so the script accepts many files: <code>for FQ in "$@"; do ... done</code>.']
},
{id:'wrap', title:'PATH, bin & wrappers', blurb:'which, ~/bin, export PATH, source, wrapper scripts',
 lessons:[
  {h:'PATH: where commands live', when:'When you type <code>samtools</code>, bash searches each folder listed in <code>$PATH</code>, left to right. <code>which</code> tells you which file it found.', code:'$ echo $PATH\n/home/you/bin:/usr/local/bin:/usr/bin:/bin\n$ which samtools\n/apps/samtools/1.17/bin/samtools', watch:'"command not found" = no folder on PATH holds that program (or the module is not loaded).'},
  {h:'Your own bin folder', when:'Keep finished, reusable scripts in <code>~/bin</code> (bin = binaries, i.e. runnable things) and add it to PATH once in <code>~/.bashrc</code>. Then you can call them from any folder by name.', code:'mkdir -p ~/bin\ncp count_reads.sh ~/bin/count_reads\nchmod +x ~/bin/count_reads\necho \'export PATH="$HOME/bin:$PATH"\' >> ~/.bashrc\nsource ~/.bashrc', watch:'Always keep <code>:$PATH</code> on the end. Without it you replace PATH and even <code>ls</code> stops working.'},
  {h:'bash vs source', when:'<code>bash script.sh</code> runs in a new, separate shell; its variables vanish afterwards. <code>source script.sh</code> (or <code>. script.sh</code>) runs in your current shell, so variables and PATH changes stay. Use source for config files like <code>.bashrc</code> or <code>config.sh</code>.', code:'# config.sh\nREF=/refs/hg38.fa\nTHREADS=8\n\n# in your pipeline script\nsource config.sh\necho $REF', watch:''},
  {h:'Wrapper scripts', when:'A wrapper is a small script whose job is to call other scripts in order, or once per sample. It keeps each step in its own file (easy to test and rerun) and gives you one command to run the whole thing.', code:'project/\n  bin/run_pipeline.sh      # the wrapper\n  scripts/01_qc.sh\n  scripts/02_align.sh\n  scripts/03_count.sh\n  config.sh\n\n# bin/run_pipeline.sh\n#!/bin/bash\nset -euo pipefail\nsource config.sh\nSAMPLE=$1\nbash scripts/01_qc.sh    "$SAMPLE"\nbash scripts/02_align.sh "$SAMPLE"\nbash scripts/03_count.sh "$SAMPLE"', watch:'Number the step scripts (01_, 02_) so the order is visible from <code>ls</code>.'}
 ],
 ex:[
  {t:'cmd', q:'Find out which file runs when you type <code>samtools</code>.', acc:[/^which samtools$/, /^command -v samtools$/, /^type (-a )?samtools$/], hint:'A five-letter command.', ans:'which samtools', why:'<code>which</code> searches PATH and prints the first match.'},
  {t:'cmd', q:'Print your PATH.', acc:[/^echo "?\$\{?PATH\}?"?$/], traps:[[/^echo PATH$/,'Add <code>$</code> to read the variable.']], hint:'It is a variable.', ans:'echo $PATH', why:'Folders are separated by colons.'},
  {t:'cmd', q:'Add <code>~/bin</code> to the <b>front</b> of your PATH for this session.', acc:[/^export PATH="?(\$HOME|\$\{HOME\}|~|\/home\/\w+)\/bin:\$\{?PATH\}?"?$/, /^PATH="?(\$HOME|\$\{HOME\}|~|\/home\/\w+)\/bin:\$\{?PATH\}?"?$/], traps:[[/PATH="?(\$HOME|~)\/bin"?$/,'This replaces PATH entirely, so ls, cd helpers and samtools all disappear. Keep the old value: <code>:$PATH</code>.'],[/\$PATH:(\$HOME|~)\/bin/,'That adds it to the end. The task says the front.']], hint:'export PATH="NEW:$PATH"', ans:'export PATH="$HOME/bin:$PATH"', why:'New folder, colon, then the existing PATH.'},
  {t:'cmd', q:'You edited <code>~/.bashrc</code>. Load the changes into your current shell without logging out.', acc:[/^(source|\.) ~\/\.bashrc$/, /^(source|\.) \$HOME\/\.bashrc$/], traps:[[/^bash ~\/\.bashrc/,'bash runs it in a separate shell, and the changes vanish when it ends. Use <code>source</code>.']], hint:'source.', ans:'source ~/.bashrc', why:'source runs the file in your current shell.'},
  {t:'mcq', q:'<code>config.sh</code> sets <code>REF</code> and <code>THREADS</code>. You want those variables available in your pipeline script. Which line goes in the pipeline?', opts:['bash config.sh','./config.sh','source config.sh','export config.sh'], a:2, why:'Only <code>source</code> runs config.sh inside the same shell, so the variables remain.'},
  {t:'script', q:'Write the wrapper <code>run_pipeline.sh</code>: bash shebang, safety line, take the sample name as the first argument into <code>SAMPLE</code>, then call <code>scripts/01_qc.sh</code>, <code>scripts/02_align.sh</code> and <code>scripts/03_count.sh</code>, each with the sample.', start:'', checks:[
     [s=>/^#! ?(\/bin\/bash|\/usr\/bin\/env bash)\s*$/.test(firstLine(s)),'Line 1 is a bash shebang'],
     [/set -[a-z]*e/,'Safety line'],
     [/^\s*SAMPLE="?\$\{?1\}?"?\s*$/m,'SAMPLE=$1'],
     [/01_qc\.sh\s+"?\$\{?SAMPLE\}?"?/,'Calls 01_qc.sh with "$SAMPLE"'],
     [/02_align\.sh\s+"?\$\{?SAMPLE\}?"?/,'Calls 02_align.sh with "$SAMPLE"'],
     [/03_count\.sh\s+"?\$\{?SAMPLE\}?"?/,'Calls 03_count.sh with "$SAMPLE"']],
   ans:'#!/bin/bash\nset -euo pipefail\n\nSAMPLE=$1\nbash scripts/01_qc.sh    "$SAMPLE"\nbash scripts/02_align.sh "$SAMPLE"\nbash scripts/03_count.sh "$SAMPLE"', why:'Because of <code>set -e</code>, if QC fails the wrapper stops before aligning.'}
 ],
 lab:['Make <code>~/bin</code>, put one script there, add it to PATH in <code>~/.bashrc</code>, <code>source</code> it, then run the script from your home folder by name.','Run <code>which</code> on <code>ls</code>, <code>python3</code>, and your new script.','Build the wrapper layout above with three tiny step scripts that just <code>echo</code> their name and sample.']
},
{id:'module', title:'HPC modules', blurb:'module avail, spider, load, list, purge',
 lessons:[
  {h:'Why modules exist', when:'A cluster has many tools in many versions. They are hidden until you load them, so nothing clashes. If a tool says "command not found" on the cluster, the first thing to try is loading its module.', code:'$ samtools\nbash: samtools: command not found\n$ module load samtools/1.17\n$ samtools --version | head -1\nsamtools 1.17', watch:''},
  {h:'Find: avail and spider', when:'<code>module avail</code> lists everything you can load right now (often a long list). <code>module avail samtools</code> filters it. <code>module spider samtools</code> (Lmod clusters) searches every version, including ones that need another module loaded first, and tells you how to load them.', code:'$ module avail samtools\n   samtools/1.15   samtools/1.17 (D)\n$ module spider samtools/1.17', watch:'<code>(D)</code> marks the default version.'},
  {h:'Load, list, unload, purge', when:'<code>load</code> adds a tool, <code>list</code> shows what is loaded, <code>unload</code> removes one, <code>purge</code> removes everything. Start job scripts with <code>module purge</code> so they do not depend on whatever you had loaded.', code:'module purge\nmodule load samtools/1.17 bwa/0.7.17\nmodule list', watch:'Pin versions in scripts (<code>samtools/1.17</code>, not <code>samtools</code>). The default can change and silently change your results.'},
  {h:'Inspect', when:'<code>module show samtools/1.17</code> prints what loading it does (which folder it adds to PATH). Handy when something seems wrong.', code:'$ module show samtools/1.17', watch:'Some clusters use <code>ml</code> as a shortcut: <code>ml samtools/1.17</code>, <code>ml</code> = list.'}
 ],
 ex:[
  {t:'cmd', q:'See which versions of samtools the cluster offers.', acc:[/^module (avail|av|spider) samtools$/, /^ml (avail|av|spider) samtools$/], hint:'module + avail + name.', ans:'module avail samtools', why:'Or <code>module spider samtools</code> on Lmod for the full picture.'},
  {t:'cmd', q:'Load samtools version 1.17.', acc:[/^module (load|add) samtools\/1\.17$/, /^ml samtools\/1\.17$/], traps:[[/^module load samtools$/,'That loads the default version. Pin it: <code>samtools/1.17</code>.'],[/samtools-1\.17|samtools 1\.17/,'Module names use a slash between tool and version.']], hint:'module load tool/version', ans:'module load samtools/1.17', why:'Exact versions make your analysis reproducible.'},
  {t:'cmd', q:'Show the modules currently loaded.', acc:[/^module (list|li)$/, /^ml$/], hint:'module + one word.', ans:'module list', why:''},
  {t:'cmd', q:'Unload everything to start from a clean slate.', acc:[/^module purge$/, /^ml purge$/], hint:'A word meaning "clear out".', ans:'module purge', why:'Do this at the top of job scripts.'},
  {t:'mcq', q:'Why write <code>module load samtools/1.17</code> in a script instead of <code>module load samtools</code>?', opts:['It runs faster','The default version can change, which can silently change results','samtools will not load without a version','It uses less memory'], a:1, why:'Reproducibility: rerun next year, get the same tool.'},
  {t:'mcq', q:'On the cluster you type <code>bwa</code> and get "command not found". Most likely fix?', opts:['Reinstall Linux','chmod +x bwa','module load bwa/&lt;version&gt;','cd into the bwa folder'], a:2, why:'The tool is installed but not on your PATH until its module is loaded.'}
 ],
 lab:['On your cluster run <code>module avail</code> and skim. Then <code>module avail</code> for three tools you use (samtools, fastqc, R).','Load one, run <code>which</code> on it, then <code>module show</code> it and find the folder it added to PATH.','<code>module purge</code>, then <code>which samtools</code> again.']
},
{id:'slurm', title:'SLURM jobs, CPU & GPU', blurb:'#SBATCH, --time=, sbatch, squeue, arrays',
 lessons:[
  {h:'Login node vs compute node', when:'The login node is for editing, moving files and submitting. Anything heavy (alignment, sorting a BAM, R on big matrices) goes to compute nodes through the scheduler, or an interactive session.', code:'$ sbatch align.sbatch                       # batch job\n$ srun --pty -c 4 --mem=8G -t 1:00:00 bash  # interactive', watch:'Running bwa on the login node slows it for everyone and may get your process killed.'},
  {h:'Anatomy of a job script', when:'A job script is a normal bash script. After the shebang come <code>#SBATCH</code> lines (requests to the scheduler), then <code>module</code> lines, then your commands. The <code>#SBATCH</code> lines must come before the first command.', code:'#!/bin/bash\n#SBATCH --job-name=align_S1\n#SBATCH --time=04:00:00\n#SBATCH --cpus-per-task=8\n#SBATCH --mem=32G\n#SBATCH --output=logs/%x_%j.out\n\nset -euo pipefail\nmodule purge\nmodule load bwa/0.7.17 samtools/1.17\n\nbwa mem -t $SLURM_CPUS_PER_TASK ref.fa R1.fq.gz R2.fq.gz \\\n  | samtools sort -@ 4 -o S1.bam', watch:'The <code>.sbatch</code> or <code>.slurm</code> extension is only a naming habit; it is still a bash script.'},
  {h:'The format of options', when:'Long options use two dashes and <code>=</code> with no spaces: <code>--time=04:00:00</code>. Short forms use one dash and a space: <code>-t 04:00:00</code>, <code>-c 8</code>. Time is <code>HH:MM:SS</code> or <code>D-HH:MM:SS</code>.', code:'--time=30:00          # 30 minutes\n--time=04:30:00       # 4.5 hours\n--time=2-00:00:00     # 2 days\n--mem=16G             # memory per node\n--partition=gpu       # which queue', watch:'If the job exceeds <code>--time</code> or <code>--mem</code>, SLURM kills it. Check the .out log for "TIMEOUT" or "OUT_OF_MEMORY".'},
  {h:'CPU or GPU?', when:'Ask for CPUs with <code>--cpus-per-task</code> and pass the same number to the tool\'s thread option. Ask for a GPU (<code>--gres=gpu:1</code>, usually on a gpu partition) only when the tool is built for GPUs: deep-learning basecallers (dorado), AlphaFold, GPU-accelerated aligners (Parabricks), PyTorch models. bwa, STAR, samtools, featureCounts and most R packages are CPU-only.', code:'#SBATCH --cpus-per-task=8\nSTAR --runThreadN $SLURM_CPUS_PER_TASK ...\n\n#SBATCH --partition=gpu\n#SBATCH --gres=gpu:1\ndorado basecaller ...', watch:'A GPU requested for a CPU tool sits idle and you wait longer in the GPU queue.'},
  {h:'Submit and watch', when:'<code>sbatch</code> submits, <code>squeue -u $USER</code> (or <code>squeue --me</code>) shows your jobs, <code>scancel</code> stops one, <code>sacct -j ID</code> shows how it ended.', code:'$ sbatch align.sbatch S1\nSubmitted batch job 4815162\n$ squeue -u $USER\n$ scancel 4815162\n$ sacct -j 4815162 --format=JobID,State,Elapsed,MaxRSS', watch:'Arguments after the script name become <code>$1</code>, <code>$2</code> inside it, same as any script.'},
  {h:'Many samples: loop or array', when:'Loop over a sample list and <code>sbatch</code> each, or use a job array where <code>$SLURM_ARRAY_TASK_ID</code> picks the line.', code:'# loop\nwhile read s; do sbatch align.sbatch "$s"; done < samples.txt\n\n# array (in the job script)\n#SBATCH --array=1-24\nSAMPLE=$(sed -n "${SLURM_ARRAY_TASK_ID}p" samples.txt)', watch:''}
 ],
 ex:[
  {t:'mcq', q:'Which <code>--time</code> means 2 days and 6 hours?', opts:['--time=2:06:00','--time=54','--time=2-06:00:00','--time=06:00:00:02'], a:2, why:'Days come first, then a dash: <code>D-HH:MM:SS</code>.'},
  {t:'cmd', q:'Write the <code>#SBATCH</code> line requesting 4 hours 30 minutes.', acc:[/^#SBATCH --time=0?4:30:00$/, /^#SBATCH -t 0?4:30:00$/, /^#SBATCH --time=270$/], traps:[[/--time 0?4:30/,'Long options take <code>=</code>: <code>--time=04:30:00</code>.'],[/^--time/,'In a script it needs the <code>#SBATCH</code> prefix.'],[/--time=4:30$/,'<code>4:30</code> is read as 4 minutes 30 seconds. Write HH:MM:SS.']], hint:'#SBATCH --time=HH:MM:SS', ans:'#SBATCH --time=04:30:00', why:''},
  {t:'cmd', q:'Write the <code>#SBATCH</code> line asking for 8 CPU cores for your task.', acc:[/^#SBATCH --cpus-per-task=8$/, /^#SBATCH -c ?8$/], traps:[[/--ntasks=8|-n ?8/,'<code>--ntasks</code> is for running 8 separate processes (MPI). Multithreaded tools want <code>--cpus-per-task</code>.']], hint:'--cpus-per-task', ans:'#SBATCH --cpus-per-task=8', why:'Then inside the script use <code>$SLURM_CPUS_PER_TASK</code> for the tool\'s threads.'},
  {t:'cmd', q:'Write the <code>#SBATCH</code> line requesting one GPU.', acc:[/^#SBATCH --gres=gpu(:\w+)?:1$/, /^#SBATCH --gpus(-per-node|-per-task)?=1$/, /^#SBATCH -G ?1$/], hint:'gres = generic resource.', ans:'#SBATCH --gres=gpu:1', why:'Most clusters also want <code>--partition=gpu</code> (name varies; check your cluster docs).'},
  {t:'mcq', q:'You are aligning RNA-seq with STAR. What do you request?', opts:['One GPU','Several CPUs and enough memory (STAR needs ~32 GB for human)','A GPU and 1 CPU','Nothing; run it on the login node'], a:1, why:'STAR is a CPU tool: <code>--cpus-per-task</code>, plenty of <code>--mem</code>, and <code>--runThreadN $SLURM_CPUS_PER_TASK</code>.'},
  {t:'cmd', q:'Submit <code>align.sbatch</code> to the queue.', acc:[/^sbatch align\.sbatch$/], traps:[[/^(bash|\.\/|sh )/,'That runs it right here on the login node. <code>sbatch</code> hands it to the scheduler.'],[/^srun/,'srun runs interactively and waits. For a batch job use sbatch.']], hint:'s + batch.', ans:'sbatch align.sbatch', why:'SLURM replies with a job ID.'},
  {t:'cmd', q:'Show only your own jobs in the queue.', acc:[/^squeue (-u|--user) ?(\$USER|\$\{USER\}|"\$USER"|\w+)$/, /^squeue --me$/], hint:'squeue, filtered by user.', ans:'squeue -u $USER', why:'<code>$USER</code> holds your username. Columns: ST = state (PD pending, R running).'},
  {t:'cmd', q:'Cancel job <code>4815162</code>.', acc:[/^scancel 4815162$/], hint:'s + cancel.', ans:'scancel 4815162', why:'<code>scancel -u $USER</code> would cancel all of yours, so use with care.'},
  {t:'cmd', q:'Inside the job, run <code>bwa mem</code> with as many threads as you requested, on <code>ref.fa R1.fq.gz R2.fq.gz</code>, saving to <code>S1.sam</code>.', acc:[/^bwa mem -t "?\$\{?SLURM_CPUS_PER_TASK\}?"? ref\.fa R1\.fq\.gz R2\.fq\.gz ?> ?S1\.sam$/], traps:[[/-t ?\d/,'A hard-coded number works but drifts out of sync with <code>#SBATCH</code>. Use <code>$SLURM_CPUS_PER_TASK</code>.']], hint:'-t $SLURM_CPUS_PER_TASK', ans:'bwa mem -t $SLURM_CPUS_PER_TASK ref.fa R1.fq.gz R2.fq.gz > S1.sam', why:'SLURM fills that variable from your <code>--cpus-per-task</code>.'},
  {t:'cmd', q:'Submit one job per line of <code>samples.txt</code>, passing each sample to <code>align.sbatch</code>.', acc:[/^while (IFS= )?read (-r )?(\w+); ?do sbatch align\.sbatch "?\$\{?\3\}?"?; ?done ?< ?samples\.txt$/, /^for (\w+) in \$\(cat samples\.txt\); ?do sbatch align\.sbatch "?\$\{?\1\}?"?; ?done$/], hint:'while read s; do ... ; done < samples.txt', ans:'while read s; do sbatch align.sbatch "$s"; done < samples.txt', why:'<code>read</code> pulls one line at a time into <code>$s</code>; <code>&lt; samples.txt</code> feeds the loop.'},
  {t:'script', q:'Write <code>align.sbatch</code>: bash shebang; job name <code>align</code>; 6 hours; 8 CPUs; 32G memory; output to <code>logs/%x_%j.out</code>; purge and load <code>bwa/0.7.17</code>; take the sample as <code>$1</code>; run <code>bwa mem</code> with the requested threads on <code>ref.fa ${SAMPLE}_R1.fq.gz ${SAMPLE}_R2.fq.gz</code> into <code>${SAMPLE}.sam</code>.', start:'#!/bin/bash\n', checks:[
     [s=>/^#! ?(\/bin\/bash|\/usr\/bin\/env bash)\s*$/.test(firstLine(s)),'Line 1 is a bash shebang'],
     [/^#SBATCH (--job-name=|-J ?)align\s*$/m,'#SBATCH --job-name=align'],
     [/^#SBATCH (--time=|-t ?)0?6:00:00\s*$/m,'#SBATCH --time=06:00:00'],
     [/^#SBATCH (--cpus-per-task=|-c ?)8\s*$/m,'#SBATCH --cpus-per-task=8'],
     [/^#SBATCH --mem=32(G|GB|000M?)\s*$/m,'#SBATCH --mem=32G'],
     [/^#SBATCH (--output=|-o ?)logs\/%x_%j\.out\s*$/m,'#SBATCH --output=logs/%x_%j.out'],
     [s=>sbatchBeforeCommands(s),'All #SBATCH lines come before the first command'],
     [/^\s*module purge/m,'module purge'],
     [/^\s*(module load|ml) [^\n]*bwa\/0\.7\.17/m,'module load bwa/0.7.17'],
     [/^\s*SAMPLE="?\$\{?1\}?"?\s*$/m,'SAMPLE=$1'],
     [/bwa mem -t "?\$\{?SLURM_CPUS_PER_TASK\}?"?/,'bwa mem -t $SLURM_CPUS_PER_TASK'],
     [/\$\{SAMPLE\}_R1\.fq\.gz/,'Uses ${SAMPLE}_R1.fq.gz (with braces)'],
     [/>\s*"?\$\{?SAMPLE\}?\.sam"?/,'Writes to ${SAMPLE}.sam']],
   ans:'#!/bin/bash\n#SBATCH --job-name=align\n#SBATCH --time=06:00:00\n#SBATCH --cpus-per-task=8\n#SBATCH --mem=32G\n#SBATCH --output=logs/%x_%j.out\n\nset -euo pipefail\nmodule purge\nmodule load bwa/0.7.17\n\nSAMPLE=$1\nbwa mem -t $SLURM_CPUS_PER_TASK ref.fa \\\n  ${SAMPLE}_R1.fq.gz ${SAMPLE}_R2.fq.gz > ${SAMPLE}.sam', why:'<code>%x</code> = job name, <code>%j</code> = job ID, so every run gets its own log. Make the <code>logs/</code> folder before submitting, or SLURM cannot write there.'}
 ],
 lab:['Submit a tiny test job that only runs <code>hostname; sleep 30; echo done</code>. Watch it in <code>squeue -u $USER</code> and read its .out file.','Deliberately give it <code>--time=00:00:10</code> and see how a TIMEOUT looks in the log and in <code>sacct</code>.','Find your cluster\'s docs page and note: partition names, GPU partition name, max time.']
},
{id:'rpy', title:'Shell vs R vs Python', blurb:'pwd vs getwd(), Rscript, commandArgs, extensions',
 lessons:[
  {h:'Read the prompt first', when:'The prompt tells you which language you are typing in. <code>$</code> (or <code>[you@login01 ~]$</code>) = shell. <code>&gt;</code> = R console. <code>&gt;&gt;&gt;</code> = Python. Typing shell commands into R (or R into the shell) is the most common beginner mix-up.', code:'[you@login01 project]$ pwd          # shell\n> getwd()                            # R\n>>> import os; os.getcwd()           # Python', watch:''},
  {h:'Same job, three languages', when:'Use the shell to move files and chain tools. Use R or Python for statistics, tables and plots. Many tasks have a version in each.', code:'TASK            SHELL       R                  PYTHON\nwhere am I      pwd         getwd()            os.getcwd()\nmove            cd dir      setwd("dir")       os.chdir("dir")\nlist files      ls          list.files()       os.listdir()\nprint           echo "hi"   print("hi")        print("hi")\nvariable        x=5         x <- 5             x = 5', watch:'In R, paths are strings in quotes: <code>setwd("~/project")</code>.'},
  {h:'Run R and Python scripts from the shell', when:'In pipelines and SLURM jobs you run R and Python non-interactively: <code>Rscript file.R args</code>, <code>python3 file.py args</code>. Read the arguments inside the script.', code:'# shell\nRscript de_analysis.R counts.tsv results/\n\n# inside de_analysis.R\nargs <- commandArgs(trailingOnly = TRUE)\ncounts_file <- args[1]\nout_dir     <- args[2]\n\n# python equivalent\nimport sys\ncounts_file = sys.argv[1]', watch:'In R, <code>args[1]</code> is the first argument (R counts from 1). In Python <code>sys.argv[1]</code> is the first one, because <code>sys.argv[0]</code> is the script name.'},
  {h:'File extensions you will meet', when:'Extensions tell humans (and some tools) what is inside.', code:'.sh  .bash    bash script\n.sbatch .slurm job script (still bash)\n.R   .Rmd     R script / R Markdown\n.py  .ipynb   Python script / Jupyter notebook\n.smk          Snakemake  |  .nf  Nextflow\n.fastq.gz     raw reads  |  .fa/.fasta  sequences\n.sam .bam     alignments |  .bai  BAM index\n.vcf.gz       variants   |  .bed .gtf  annotations', watch:''}
 ],
 ex:[
  {t:'mcq', q:'The prompt is <code>&gt;</code> in the RStudio console. How do you show the working directory?', opts:['pwd','getwd()','echo $PWD','os.getcwd()'], a:1, why:'You are in R, so use the R function.'},
  {t:'mcq', q:'The prompt is <code>[you@login01 ~]$</code>. How do you show the working directory?', opts:['getwd()','pwd','print(dir)','wd'], a:1, why:'The <code>$</code> means you are in the shell.'},
  {t:'cmd', ctx:'(R console)', ps:'>', q:'In R, set the working directory to <code>~/project</code>.', acc:[/^setwd\((["'])~\/project\/?\1\)$/], traps:[[/^cd /,'That is shell. In R the function is <code>setwd()</code>.'],[/^setwd\(~/,'In R the path is a string, so it needs quotes.']], hint:'setwd("...")', ans:'setwd("~/project")', why:''},
  {t:'cmd', q:'From the shell, run <code>de_analysis.R</code> with <code>counts.tsv</code> as its argument.', acc:[/^Rscript (\.\/)?de_analysis\.R counts\.tsv$/], traps:[[/^R de_analysis/,'Plain <code>R</code> opens the interactive console. Use <code>Rscript</code>.'],[/^(bash|\.\/)/,'bash cannot read R code. Use <code>Rscript</code>.']], hint:'Rscript file args', ans:'Rscript de_analysis.R counts.tsv', why:''},
  {t:'mcq', q:'Inside <code>de_analysis.R</code>, how do you get that <code>counts.tsv</code> argument?', opts:['$1','sys.argv[1]','commandArgs(trailingOnly = TRUE)[1]','args$1'], a:2, why:'<code>commandArgs(trailingOnly = TRUE)</code> returns only your arguments; <code>[1]</code> is the first.'},
  {t:'mcq', q:'Is a <code>.sbatch</code> file a different language from a <code>.sh</code> file?', opts:['Yes, it is SLURM language','No, both are bash; .sbatch is just a naming habit','Yes, it needs a special interpreter','Only on GPU nodes'], a:1, why:'Both are bash. The <code>#SBATCH</code> lines are bash comments that SLURM happens to read.'},
  {t:'mcq', q:'Which file is the index for <code>S1.bam</code>?', opts:['S1.bed','S1.bam.bai','S1.fai','S1.idx'], a:1, why:'<code>samtools index S1.bam</code> creates S1.bam.bai. (.fai is the index of a FASTA.)'}
 ],
 lab:['Write a 3-line R script that prints <code>commandArgs(trailingOnly = TRUE)</code>, then run it with <code>Rscript test.R a b c</code>.','Add <code>#!/usr/bin/env Rscript</code> on top, <code>chmod +x</code> it, and run it as <code>./test.R a b</code>.','Call that R script from a bash script, inside a SLURM job, after <code>module load R/&lt;version&gt;</code>.']
},
{id:'git', title:'Git & GitHub', blurb:'init, status, add, commit, push, pull, .gitignore',
 lessons:[
  {h:'What git is for', when:'Git keeps the history of your <b>code</b> (scripts, notes, configs) so you can see what changed, undo mistakes, and share with GitHub. Use it for every project from day one.', code:'$ cd ~/project\n$ git init\nInitialized empty Git repository in /home/you/project/.git/', watch:'Git is for code, not data. Keep FASTQ, BAM and large results out of it.'},
  {h:'The daily loop', when:'Edit files, then: <code>git status</code> (what changed?), <code>git add</code> (choose what goes in), <code>git commit -m</code> (save a snapshot with a message), <code>git push</code> (send to GitHub).', code:'$ git status\n$ git add scripts/count_reads.sh\n$ git commit -m "Add read counting script"\n$ git push', watch:'Run <code>git status</code> constantly. It tells you what to do next.'},
  {h:'.gitignore', when:'List files git should never track. Put it in the project root and commit it.', code:'# .gitignore\ndata/\n*.fastq.gz\n*.bam\n*.bai\nlogs/\n.Rhistory', watch:'GitHub refuses files over 100 MB, and a pushed BAM is painful to remove from history.'},
  {h:'Working with GitHub', when:'<code>git clone URL</code> copies an existing repo. For your own new project, create an empty repo on GitHub, then connect it with <code>git remote add origin URL</code> and <code>git push -u origin main</code> the first time. <code>git pull</code> brings down others\' changes.', code:'$ git clone https://github.com/lab/rnaseq-pipeline.git\n$ git remote add origin git@github.com:you/project.git\n$ git push -u origin main\n$ git pull', watch:''},
  {h:'Look back', when:'<code>git log --oneline</code> shows history; <code>git diff</code> shows unstaged changes line by line.', code:'$ git log --oneline\na1b2c3d Add read counting script\n9f8e7d6 Initial commit', watch:''}
 ],
 ex:[
  {t:'cmd', q:'Turn the current project folder into a git repository.', acc:[/^git init$/], hint:'git + initialise.', ans:'git init', why:'Creates a hidden <code>.git</code> folder that stores the history.'},
  {t:'cmd', q:'See which files changed and what is staged.', acc:[/^git status( -s)?$/], hint:'git + state of things.', ans:'git status', why:''},
  {t:'cmd', q:'Stage <code>count_reads.sh</code> for the next commit.', acc:[/^git add (\.\/)?count_reads\.sh$/], hint:'git add file', ans:'git add count_reads.sh', why:'Staging chooses exactly what goes into the commit.'},
  {t:'cmd', q:'Commit with the message <code>Add read counting script</code>.', acc:[/^git commit -m (["'])Add read counting script\1$/], traps:[[/^git commit -m Add/,'Wrap the message in quotes, or bash splits it into separate words.']], hint:'git commit -m "..."', ans:'git commit -m "Add read counting script"', why:'Write messages that say what the change does.'},
  {t:'cmd', q:'Download the repository <code>https://github.com/lab/rnaseq-pipeline.git</code>.', acc:[/^git clone https:\/\/github\.com\/lab\/rnaseq-pipeline(\.git)?$/], hint:'git clone URL', ans:'git clone https://github.com/lab/rnaseq-pipeline.git', why:''},
  {t:'cmd', q:'Send your commits to GitHub (remote <code>origin</code>, branch <code>main</code>).', acc:[/^git push( -u)?( origin main)?$/, /^git push origin main$/], hint:'git push origin main', ans:'git push origin main', why:'After the first <code>git push -u origin main</code>, plain <code>git push</code> is enough.'},
  {t:'cmd', q:'Get your labmate\'s new commits from GitHub into your copy.', acc:[/^git pull( origin main)?$/], hint:'The opposite of push.', ans:'git pull', why:''},
  {t:'cmd', q:'With one shell command, add the pattern <code>*.bam</code> to <code>.gitignore</code> (keep what is already there).', acc:[/^echo (["'])\*\.bam\1 ?>> ?\.gitignore$/, /^echo \*\.bam ?>> ?\.gitignore$/], traps:[[/[^>]> ?\.gitignore$/,'A single <code>&gt;</code> would wipe your existing .gitignore. Append with <code>&gt;&gt;</code>.']], hint:'echo + append.', ans:'echo "*.bam" >> .gitignore', why:'Pipes & redirection, reused.'},
  {t:'mcq', q:'What is the right order to publish a change?', opts:['commit → add → push','add → commit → push','push → add → commit','add → push → commit'], a:1, why:'Stage, snapshot, send.'},
  {t:'cmd', q:'Show the project history, one line per commit.', acc:[/^git log --oneline( -n ?\d+| -\d+)?$/], hint:'git log with a flag.', ans:'git log --oneline', why:''}
 ],
 lab:['Run <code>git init</code> in your <code>~/practice</code> folder, write a <code>.gitignore</code> with <code>data/</code>, and make your first commit.','Create a free GitHub repo, connect it with <code>git remote add origin ...</code>, and push.','Daily habit: end every practice session with <code>git add</code>, <code>git commit -m "Day N: ..."</code>, <code>git push</code>. Your GitHub becomes your practice log.']
},
/* ---------------- GENOMICS WORKFLOWS ---------------- */
{id:'qc', sec:'Genomics workflows', title:'QC & trimming', blurb:'FastQC, MultiQC, fastp, Trim Galore, cutadapt',
 lessons:[
  {h:'FastQC: first look at raw reads', when:'Run it the moment you receive FASTQ files, and again after trimming. It writes one <code>_fastqc.html</code> report (open in a browser) and one <code>.zip</code> per file. <code>-t</code> sets threads, <code>-o</code> the output folder (which must already exist).', code:'$ mkdir -p qc/raw\n$ fastqc -t 4 -o qc/raw data/*.fastq.gz\n$ ls qc/raw\nS1_R1_fastqc.html  S1_R1_fastqc.zip ...', watch:'Run it on a compute node or in a job when you have many files.'},
  {h:'MultiQC: all samples on one page', when:'After FastQC (and later STAR, featureCounts, fastp, bowtie2…), run MultiQC on the folder. It finds every log it understands and builds one report, so an odd sample stands out.', code:'$ multiqc qc/ -o qc/multiqc\n# open qc/multiqc/multiqc_report.html', watch:''},
  {h:'Reading the FastQC report', when:'<b>Per base sequence quality</b>: boxes in the green zone (Phred ≥ 28) are good; quality dropping at the 3\' end is normal. <b>Adapter content</b>: a curve rising toward the 3\' end means you must trim adapters. <b>Per base sequence content</b>: a FAIL over the first ~10–12 bases is expected in RNA-seq (random hexamer priming), not a problem. <b>Sequence duplication</b>: high in RNA-seq is normal (very highly expressed genes); in WGS or ChIP-seq it suggests PCR duplicates or low input. <b>Per sequence GC content</b>: two peaks can mean contamination.', code:'Phred  error rate   accuracy\nQ10    1 in 10      90%\nQ20    1 in 100     99%\nQ30    1 in 1,000   99.9%\nQ40    1 in 10,000  99.99%', watch:'FastQC\'s pass/warn/fail flags assume random genomic DNA. Judge each module against your assay type.'},
  {h:'fastp: trim + QC in one step', when:'A fast all-in-one trimmer. For paired-end data give both files together so pairs stay in sync.', code:'fastp \\\n  -i S1_R1.fastq.gz -I S1_R2.fastq.gz \\\n  -o trimmed/S1_R1.fastq.gz -O trimmed/S1_R2.fastq.gz \\\n  --detect_adapter_for_pe \\\n  -q 20 -l 36 -w 8 \\\n  -h qc/S1.fastp.html -j qc/S1.fastp.json\n\n# -i/-I  inputs R1/R2      -o/-O  outputs R1/R2\n# -q 20  a base is "good" if Phred >= 20\n# -l 36  drop reads shorter than 36 after trimming\n# -w 8   threads   -h/-j  reports (MultiQC reads the .json)', watch:''},
  {h:'Trim Galore and cutadapt', when:'Trim Galore wraps cutadapt, auto-detects the Illumina adapter, and can run FastQC afterwards. Use cutadapt directly when you know the exact adapter (small RNA, custom libraries).', code:'trim_galore --paired --quality 20 --length 36 --fastqc \\\n  -o trimmed S1_R1.fastq.gz S1_R2.fastq.gz\n# -> trimmed/S1_R1_val_1.fq.gz  trimmed/S1_R2_val_2.fq.gz\n\ncutadapt -a AGATCGGAAGAGC -A AGATCGGAAGAGC -q 20 -m 36 \\\n  -o out_R1.fq.gz -p out_R2.fq.gz S1_R1.fastq.gz S1_R2.fastq.gz\n# -a/-A adapter on R1/R2   -m minimum length   -p paired output', watch:'Trim gently for RNA-seq (Q20 is plenty). Aggressive quality trimming throws away real data and can bias expression.'}
 ],
 ex:[
  {t:'cmd', q:'Run FastQC on every <code>.fastq.gz</code> in <code>data/</code>, with 4 threads, writing reports to <code>qc/raw</code> (already created).', acc:[has(/^fastqc /,/(-t|--threads)[ =]4\b/,/(-o|--outdir)[ =]qc\/raw\/?( |$)/,/data\/\*\.fastq\.gz( |$)/)], traps:[[/^fastqc data\/\*\.fastq\.gz$/,'That works, but writes reports next to your data and uses 1 thread. Add <code>-t 4 -o qc/raw</code>.']], hint:'fastqc -t … -o … files', ans:'fastqc -t 4 -o qc/raw data/*.fastq.gz', why:'If <code>qc/raw</code> does not exist, FastQC stops with an error, so <code>mkdir -p</code> it first.'},
  {t:'cmd', q:'Combine every report in <code>qc/</code> into one MultiQC report in <code>qc/multiqc</code>.', acc:[/^multiqc (qc\/? (-o|--outdir)[ =]qc\/multiqc\/?|(-o|--outdir)[ =]qc\/multiqc\/? qc\/?)$/], hint:'multiqc FOLDER -o OUTDIR', ans:'multiqc qc/ -o qc/multiqc', why:'MultiQC scans the folder recursively for any log it recognises.'},
  {t:'mcq', q:'RNA-seq FastQC: <b>Per base sequence content</b> FAILS over the first 12 bases only. What do you do?', opts:['Trim 12 bases from every read','Nothing: this is the expected random-hexamer priming bias in RNA-seq','Discard the sample','Re-sequence'], a:1, why:'It is a known artefact of library prep, and aligners handle it fine. Trimming it off only loses data.'},
  {t:'mcq', q:'<b>Adapter content</b> rises to 30% toward the 3\' end of the reads. What does it mean?', opts:['The library is contaminated with bacteria','Many inserts were shorter than the read length, so the sequencer read into the adapter: trim adapters','Quality is too low; discard the run','Duplication is too high'], a:1, why:'Short fragments make the read run past the insert into the adapter. Trimming removes it before alignment.'},
  {t:'mcq', q:'A base with quality Q30 has what chance of being wrong?', opts:['1 in 30','1 in 100','1 in 1,000','30%'], a:2, why:'Phred Q = −10·log10(error). Q30 → 10⁻³ = 1 in 1,000.'},
  {t:'script', q:'Write the <code>fastp</code> command for paired reads <code>S1_R1.fastq.gz</code> / <code>S1_R2.fastq.gz</code>. Outputs go to <code>trimmed/</code> with the same names. Auto-detect paired-end adapters, quality cut-off 20, minimum length 36, 8 threads, and write both an HTML and a JSON report. You can split lines with <code>\\</code>.', start:'fastp \\\n  ', checks:[
     [/^\s*fastp\b/m,'Starts with fastp'],
     [/(-i|--in1)[ =]S1_R1\.fastq\.gz/,'-i S1_R1.fastq.gz (read 1 in)'],
     [/(-I|--in2)[ =]S1_R2\.fastq\.gz/,'-I S1_R2.fastq.gz (read 2 in)'],
     [/(-o|--out1)[ =]trimmed\/S1_R1\.fastq\.gz/,'-o trimmed/S1_R1.fastq.gz'],
     [/(-O|--out2)[ =]trimmed\/S1_R2\.fastq\.gz/,'-O trimmed/S1_R2.fastq.gz'],
     [/--detect_adapter_for_pe/,'--detect_adapter_for_pe'],
     [/(-q|--qualified_quality_phred)[ =]20\b/,'-q 20'],
     [/(-l|--length_required)[ =]36\b/,'-l 36'],
     [/(-w|--thread)[ =]8\b/,'-w 8'],
     [/(-h|--html)[ =]\S+\.html/,'-h something.html'],
     [/(-j|--json)[ =]\S+\.json/,'-j something.json (MultiQC reads it)']],
