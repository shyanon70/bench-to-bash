   ans:'fastp \\\n  -i S1_R1.fastq.gz -I S1_R2.fastq.gz \\\n  -o trimmed/S1_R1.fastq.gz -O trimmed/S1_R2.fastq.gz \\\n  --detect_adapter_for_pe -q 20 -l 36 -w 8 \\\n  -h qc/S1.fastp.html -j qc/S1.fastp.json', why:'Lowercase <code>-i/-o</code> are read 1; uppercase <code>-I/-O</code> are read 2. The <code>\\</code> at a line end means "the command continues on the next line"; nothing may follow it, not even a space.'},
  {t:'cmd', q:'Run Trim Galore on <code>S1_R1.fastq.gz</code> and <code>S1_R2.fastq.gz</code> as a pair, quality 20, minimum length 36, run FastQC afterwards, output to <code>trimmed</code>.', acc:[has(/^trim_galore /,/--paired\b/,/(-q|--quality)[ =]20\b/,/--length[ =]36\b/,/--fastqc\b/,/(-o|--output_dir)[ =]trimmed\/?( |$)/,/S1_R1\.fastq\.gz S1_R2\.fastq\.gz$/)], traps:[[/^trim_galore (?!.*--paired)/,'Without <code>--paired</code> the two files are trimmed independently and the pairs fall out of sync.']], hint:'trim_galore --paired … R1 R2 (input files last)', ans:'trim_galore --paired --quality 20 --length 36 --fastqc -o trimmed S1_R1.fastq.gz S1_R2.fastq.gz', why:'Output names end in <code>_val_1.fq.gz</code> / <code>_val_2.fq.gz</code>.'},
  {t:'mcq', q:'Why must paired-end files be trimmed together in one command?', opts:['It is faster','If a read is dropped from R1 but kept in R2, the files fall out of order and the aligner pairs the wrong reads','R2 has no adapters','FastQC requires it'], a:1, why:'Paired tools drop both mates together, keeping line N of R1 matched to line N of R2.'},
  {t:'mcq', q:'In <code>cutadapt … -m 36</code>, what does <code>-m 36</code> do?', opts:['Trims 36 bases from every read','Discards reads shorter than 36 bp after trimming','Sets 36 threads','Sets minimum quality 36'], a:1, why:'Very short reads map ambiguously, so they are removed.'}
 ],
 lab:['Get a tiny paired-end test set (the nf-core/test-datasets repository on GitHub has small FASTQs for most assays) and run FastQC on it.','Trim with fastp, run FastQC on the trimmed reads, then one MultiQC over both. Compare the Adapter content plot before and after.','Turn it into <code>01_qc_trim.sbatch</code> that takes the sample name as <code>$1</code>.']
},
{id:'rnaseq', sec:'Genomics workflows', title:'RNA-seq', blurb:'STAR, featureCounts, salmon, DESeq2',
 lessons:[
  {h:'The pipeline', when:'Two common routes. <b>Alignment</b>: trim → STAR (or HISAT2) → BAM → featureCounts → count matrix → DESeq2. Use it when you also want BAMs (to view in IGV, find splicing, call variants). <b>Pseudo-alignment</b>: trim → salmon (or kallisto) → tximport → DESeq2. Faster, less memory, gives transcript-level estimates.', code:'FASTQ ─ fastp ─┬─ STAR ── BAM ── featureCounts ─┐\n               └─ salmon ── quant.sf ── tximport ┴─ DESeq2 (R)', watch:''},
  {h:'STAR: build the index once', when:'Build one index per genome + annotation + read length, and reuse it for every project. <code>--sjdbOverhang</code> = read length − 1. Human needs ~32 GB RAM.', code:'STAR --runMode genomeGenerate \\\n  --genomeDir star_idx \\\n  --genomeFastaFiles genome.fa \\\n  --sjdbGTFfile genes.gtf \\\n  --sjdbOverhang 99 \\\n  --runThreadN 8', watch:'Genome FASTA and GTF must come from the same source and version (e.g. both GENCODE v44, or both Ensembl 110). Mixing "chr1" with "1" gives zero counts.'},
  {h:'STAR: align a sample', when:'Run per sample inside a job script. Read <code>Log.final.out</code> afterwards: "Uniquely mapped reads %" around 70–90% is typical for good human/mouse data.', code:'STAR --genomeDir star_idx \\\n  --readFilesIn S1_R1.fastq.gz S1_R2.fastq.gz \\\n  --readFilesCommand zcat \\\n  --outSAMtype BAM SortedByCoordinate \\\n  --outFileNamePrefix aligned/S1_ \\\n  --quantMode GeneCounts \\\n  --runThreadN $SLURM_CPUS_PER_TASK', watch:'<code>--readFilesCommand zcat</code> is needed because the FASTQs are gzipped.'},
  {h:'featureCounts: reads per gene', when:'Counts aligned reads over genes in the GTF, for all BAMs at once. The key parameter is <b>strandedness</b> <code>-s</code>: 0 unstranded, 1 stranded, 2 reversely stranded (most dUTP / TruSeq Stranded kits). If unsure, try all three on one sample and keep the one with by far the most assigned reads, or check STAR\'s ReadsPerGene columns.', code:'featureCounts -T 8 -p --countReadPairs -s 2 \\\n  -a genes.gtf -o counts.txt aligned/*.bam\n\n# -p --countReadPairs  paired-end: count fragments (Subread >= 2.0.2)\n# counts.txt.summary   how many reads were Assigned / NoFeature / Ambiguous', watch:'Wrong <code>-s</code> is the classic silent error: the run "works" but most reads land in Unassigned_NoFeatures.'},
  {h:'salmon: fast transcript quantification', when:'<code>-l A</code> lets salmon detect library type; <code>quant.sf</code> holds per-transcript estimates. Import into R with tximport.', code:'salmon quant -i salmon_idx -l A \\\n  -1 S1_R1.fastq.gz -2 S1_R2.fastq.gz \\\n  -p 8 --validateMappings -o salmon/S1', watch:''},
  {h:'DESeq2 in R', when:'Give DESeq2 <b>raw integer counts</b> (never TPM or normalised values) plus a sample table. The design formula names the variable you compare; <code>contrast</code> says which level is compared to which. Use <code>padj</code> (multiple-testing adjusted), not <code>pvalue</code>.', code:'library(DESeq2)\ndds <- DESeqDataSetFromMatrix(countData = counts,\n                              colData   = meta,\n                              design    = ~ condition)\ndds <- DESeq(dds)\nres <- results(dds, contrast = c("condition", "treated", "control"))\nsum(res$padj < 0.05, na.rm = TRUE)', watch:'Column names of <code>counts</code> must match the row names of <code>meta</code>, in the same order.'}
 ],
 ex:[
  {t:'mcq', q:'Your reads are 2 × 150 bp. What <code>--sjdbOverhang</code> do you use when building the STAR index?', opts:['150','149','300','75'], a:1, why:'Read length − 1. (100 is a fine generic value too; it is the max overhang STAR considers around splice junctions.)'},
  {t:'mcq', q:'Your kit is Illumina TruSeq Stranded (dUTP). Which featureCounts setting is usually right?', opts:['-s 0','-s 1','-s 2','-p 2'], a:2, why:'dUTP libraries are reversely stranded. Confirm with the summary file: the right setting gives far more Assigned reads.'},
  {t:'cmd', q:'Count all BAMs (<code>*.bam</code>) with featureCounts: 8 threads, paired-end counting fragments, reversely stranded, annotation <code>genes.gtf</code>, output <code>counts.txt</code>.', acc:[has(/^featureCounts /,/-T ?8\b/,/(^| )-p( |$)/,/--countReadPairs\b/,/-s ?2\b/,/-a genes\.gtf( |$)/,/-o counts\.txt( |$)/,/\*\.bam$/)], traps:[[/^featureCounts (?!.*--countReadPairs)(?=.*-p)/,'In Subread 2.0.2 and later, <code>-p</code> alone counts reads; add <code>--countReadPairs</code> to count fragments.']], hint:'featureCounts -T -p --countReadPairs -s -a -o BAMS (BAMs last)', ans:'featureCounts -T 8 -p --countReadPairs -s 2 -a genes.gtf -o counts.txt *.bam', why:'Input BAMs go last. Check <code>counts.txt.summary</code> right after.'},
  {t:'cmd', q:'Run salmon on sample S1 (<code>S1_R1.fastq.gz</code>, <code>S1_R2.fastq.gz</code>) using index <code>salmon_idx</code>, automatic library type, 8 threads, output folder <code>salmon/S1</code>.', acc:[has(/^salmon quant /,/(-i|--index)[ =]salmon_idx\/?( |$)/,/(-l|--libType)[ =]A( |$)/,/(-1|--mates1)[ =]S1_R1\.fastq\.gz/,/(-2|--mates2)[ =]S1_R2\.fastq\.gz/,/(-p|--threads)[ =]8\b/,/(-o|--output)[ =]salmon\/S1\/?( |$)/)], hint:'salmon quant -i -l -1 -2 -p -o', ans:'salmon quant -i salmon_idx -l A -1 S1_R1.fastq.gz -2 S1_R2.fastq.gz -p 8 -o salmon/S1', why:'The result is <code>salmon/S1/quant.sf</code>; <code>lib_format_counts.json</code> tells you which strandedness salmon detected.'},
  {t:'script', q:'Inside a job script, after <code>SAMPLE=$1</code>, write the STAR alignment for <code>${SAMPLE}_R1.fastq.gz</code> / <code>${SAMPLE}_R2.fastq.gz</code>: index <code>star_idx</code>, gzipped input, coordinate-sorted BAM, output prefix in <code>aligned/</code> named after the sample, gene counts on, threads from SLURM.', start:'SAMPLE=$1\n\nSTAR \\\n  ', checks:[
     [/STAR\b[\s\S]*--genomeDir[ =]\S*star_idx/,'--genomeDir star_idx'],
     [/--readFilesIn[ =]"?\$\{SAMPLE\}_R1\.fastq\.gz"?\s+"?\$\{SAMPLE\}_R2\.fastq\.gz"?/,'--readFilesIn ${SAMPLE}_R1.fastq.gz ${SAMPLE}_R2.fastq.gz'],
     [/--readFilesCommand[ =]"?(zcat|gunzip -c)"?/,'--readFilesCommand zcat'],
     [/--outSAMtype[ =]BAM SortedByCoordinate/,'--outSAMtype BAM SortedByCoordinate'],
     [/--outFileNamePrefix[ =]"?aligned\/\$\{?SAMPLE\}?/,'--outFileNamePrefix aligned/${SAMPLE}_'],
     [/--quantMode[ =]GeneCounts/,'--quantMode GeneCounts'],
     [/--runThreadN[ =]"?\$\{?SLURM_CPUS_PER_TASK\}?/,'--runThreadN $SLURM_CPUS_PER_TASK']],

  {t:'mcq', q:'STAR\'s <code>Log.final.out</code> says "Uniquely mapped reads % | 31%" for a human sample. Most likely?', opts:['Normal for RNA-seq','Something is wrong: wrong genome/species, heavy rRNA or adapter contamination, or a degraded sample','The BAM was not sorted','featureCounts failed'], a:1, why:'Good libraries usually map 70–90% uniquely. Check species, adapter trimming, and rRNA content (FastQC overrepresented sequences).'},
  {t:'mcq', q:'What do you give DESeq2 as <code>countData</code>?', opts:['TPM values from salmon','Raw integer read counts per gene','log2 CPM','FPKM'], a:1, why:'DESeq2 models raw counts and does its own normalisation. For salmon output, use tximport to bring in counts properly.'},
  {t:'cmd', ctx:'(R console) counts and meta are loaded', ps:'>', q:'Create the DESeq2 object from matrix <code>counts</code>, sample table <code>meta</code>, comparing by <code>condition</code>. Store it in <code>dds</code>.', acc:[has(/^dds ?<- ?DESeqDataSetFromMatrix\(/,/countData ?= ?counts\b/,/colData ?= ?meta\b/,/design ?= ?~ ?condition\b/,/\)$/)], traps:[[/design ?= ?condition/,'The design is a formula, so it needs a tilde: <code>~ condition</code>.'],[/^dds ?= /,'<code>=</code> works in R too, but <code>&lt;-</code> is the R convention for assignment.']], hint:'DESeqDataSetFromMatrix(countData = , colData = , design = ~ )', ans:'dds <- DESeqDataSetFromMatrix(countData = counts, colData = meta, design = ~ condition)', why:'With a batch effect you would write <code>design = ~ batch + condition</code> (variable of interest last).'},
  {t:'cmd', ctx:'(R console) dds <- DESeq(dds) has run', ps:'>', q:'Get results for <b>treated vs control</b> in the <code>condition</code> column. Store them in <code>res</code>.', acc:[/^res ?<- ?results\(dds, ?contrast ?= ?c\((["'])condition\1, ?(["'])treated\2, ?(["'])control\3\)\)$/], traps:[[/c\((["'])condition\1, ?(["'])control\2, ?(["'])treated\3\)/,'Order matters: numerator first. This gives control vs treated, so every fold change flips sign.']], hint:'results(dds, contrast = c("variable", "numerator", "denominator"))', ans:'res <- results(dds, contrast = c("condition", "treated", "control"))', why:'Positive log2FoldChange then means higher in treated.'},
  {t:'mcq', q:'Which column do you filter on to call genes differentially expressed?', opts:['pvalue < 0.05','padj < 0.05','baseMean > 0.05','log2FoldChange < 0.05'], a:1, why:'Testing ~20,000 genes produces about 1,000 false hits at p < 0.05. <code>padj</code> controls the false discovery rate.'}
 ],

{id:'chip', sec:'Genomics workflows', title:'ChIP-seq', blurb:'bowtie2, MAPQ, dedup, MACS3, bigWig, FRiP',
 lessons:[
  {h:'The pipeline', when:'Trim → align with bowtie2 → keep confidently mapped reads (MAPQ filter) → remove PCR duplicates → call peaks against the <b>input control</b> with MACS3 → QC (FRiP, fingerprint) → bigWig tracks for IGV.', code:'FASTQ ─ trim ─ bowtie2 ─ MAPQ≥30 ─ dedup ─┬─ MACS3 (IP vs input) ─ peaks\n                                          └─ bamCoverage ─ bigWig', watch:'Always sequence an input (or IgG) control. Without it, open chromatin and copy-number gains look like peaks.'},
  {h:'bowtie2 alignment', when:'<code>-x</code> is the index <b>prefix</b> (the files are hg38.1.bt2, hg38.2.bt2…). The alignment summary is printed on stderr, so save it with <code>2&gt;</code>.', code:'bowtie2 -p 8 -x hg38 \\\n  -1 S1_R1.fastq.gz -2 S1_R2.fastq.gz 2> S1.bt2.log \\\n  | samtools view -b -q 30 - \\\n  | samtools sort -o S1.bam\n\n# -q 30   keep MAPQ >= 30 (uniquely, confidently placed)\n# -       read from the pipe instead of a file', watch:''},
  {h:'Remove PCR duplicates', when:'Identical fragments from PCR inflate peaks. Remove them for ChIP-seq (not usually for RNA-seq).', code:'# Picard\npicard MarkDuplicates I=S1.bam O=S1.dedup.bam \\\n  M=S1.dup_metrics.txt REMOVE_DUPLICATES=true\n\n# or samtools (paired-end)\nsamtools sort -n -o S1.nsort.bam S1.bam\nsamtools fixmate -m S1.nsort.bam S1.fix.bam\nsamtools sort -o S1.pos.bam S1.fix.bam\nsamtools markdup -r S1.pos.bam S1.dedup.bam', watch:''},
  {h:'MACS3 peak calling', when:'<code>-t</code> treatment (IP), <code>-c</code> control (input), <code>-f BAMPE</code> for paired-end, <code>-g</code> genome size (<code>hs</code> human, <code>mm</code> mouse), <code>-n</code> name prefix. Transcription factors and sharp marks (H3K4me3, H3K27ac): default narrow peaks. Broad marks (H3K27me3, H3K36me3, H3K9me3): add <code>--broad</code>.', code:'macs3 callpeak -t S1_IP.bam -c S1_input.bam \\\n  -f BAMPE -g hs -n S1 --outdir peaks -q 0.01\n# -> peaks/S1_peaks.narrowPeak  S1_summits.bed  S1_peaks.xls', watch:'Older clusters have <code>macs2</code>; the callpeak options are the same.'},
  {h:'Tracks and QC', when:'Make normalised bigWigs with deepTools to view in IGV. FRiP (fraction of reads in peaks) measures enrichment: ENCODE treats FRiP above 1% as acceptable for TF ChIP; histone marks are typically much higher.', code:'bamCoverage -b S1.dedup.bam -o S1.bw \\\n  --normalizeUsing CPM --binSize 10 -p 8\n\n# FRiP\nIN=$(bedtools intersect -u -a S1.dedup.bam -b peaks/S1_peaks.narrowPeak | samtools view -c)\nALL=$(samtools view -c S1.dedup.bam)\necho "scale=4; $IN / $ALL" | bc', watch:'<code>bc</code> does decimals; bash <code>$(( ))</code> only does whole numbers.'}
 ],
 ex:[
  {t:'mcq', q:'Why do you need an input control in ChIP-seq?', opts:['To increase read depth','To model background: open chromatin, copy-number and mappability biases that would otherwise look like peaks','To remove adapters','It is only for RNA-seq'], a:1, why:'MACS compares local IP signal to the control at the same spot.'},
  {t:'mcq', q:'You ChIP\'d H3K27me3. Which MACS3 setting matters most?', opts:['--broad','-f BAM','-q 0.5','--nomodel'], a:0, why:'H3K27me3 covers wide domains; narrow-peak mode fragments them into many small peaks.'},
  {t:'mcq', q:'What does <code>samtools view -q 30</code> keep?', opts:['The first 30 reads','Reads with base quality ≥ 30','Reads with mapping quality (MAPQ) ≥ 30','30% of reads'], a:2, why:'MAPQ says how sure the aligner is about the location. Multi-mapping reads get low MAPQ.'},
  {t:'script', q:'Align <code>S1_R1.fastq.gz</code> / <code>S1_R2.fastq.gz</code> with bowtie2 (index prefix <code>hg38</code>, 8 threads), save the alignment summary to <code>S1.bt2.log</code>, keep MAPQ ≥ 30 as BAM, and sort into <code>S1.bam</code>, all in one pipe.', start:'', checks:[
     [/^\s*bowtie2\b/m,'Starts with bowtie2'],
     [/-x[ =]hg38(\s|$)/,'-x hg38 (prefix, not a file name)'],
     [/(-p|--threads)[ =]8\b/,'-p 8'],
     [/-1[ =]S1_R1\.fastq\.gz/,'-1 S1_R1.fastq.gz'],
     [/-2[ =]S1_R2\.fastq\.gz/,'-2 S1_R2.fastq.gz'],
     [/2>\s*S1\.bt2\.log/,'2> S1.bt2.log (the summary is on stderr)'],
     [/\|\s*samtools view\b[^|]*-b/,'| samtools view -b'],
     [/samtools view\b[^|]*-b?q ?30/,'-q 30'],
     [/\|\s*samtools sort\b[^|\n]*-o[ =]S1\.bam/,'| samtools sort -o S1.bam']],
   ans:'bowtie2 -p 8 -x hg38 -1 S1_R1.fastq.gz -2 S1_R2.fastq.gz 2> S1.bt2.log \\\n  | samtools view -b -q 30 - \\\n  | samtools sort -o S1.bam', why:'No SAM file ever touches the disk, which saves a lot of space.'},
  {t:'cmd', q:'Remove duplicates with Picard: input <code>S1.bam</code>, output <code>S1.dedup.bam</code>, metrics to <code>S1.dup_metrics.txt</code>.', acc:[has(/^(picard|java -jar \S*picard\.jar) MarkDuplicates /,/(^| )(-?I|INPUT)[= ]S1\.bam( |$)/,/(^| )(-?O|OUTPUT)[= ]S1\.dedup\.bam( |$)/,/(^| )(-?M|METRICS_FILE)[= ]S1\.dup_metrics\.txt( |$)/,/REMOVE_DUPLICATES[= ]true/i)], traps:[[/^picard MarkDuplicates (?!.*REMOVE_DUPLICATES)/,'Without <code>REMOVE_DUPLICATES=true</code> Picard only flags duplicates. MACS3 ignores flagged ones, but other tools may not.']], hint:'picard MarkDuplicates I= O= M= REMOVE_DUPLICATES=true', ans:'picard MarkDuplicates I=S1.bam O=S1.dedup.bam M=S1.dup_metrics.txt REMOVE_DUPLICATES=true', why:'The metrics file has PERCENT_DUPLICATION; MultiQC can plot it.'},
  {t:'cmd', q:'Call narrow peaks: IP <code>S1_IP.bam</code>, control <code>S1_input.bam</code>, paired-end BAM, human genome size, name <code>S1</code>, output folder <code>peaks</code>.', acc:[has(/^macs[23] callpeak /,/(-t|--treatment)[ =]S1_IP\.bam/,/(-c|--control)[ =]S1_input\.bam/,/(-f|--format)[ =]BAMPE\b/,/(-g|--gsize)[ =]hs\b/,/(-n|--name)[ =]S1( |$)/,/--outdir[ =]peaks\/?( |$)/)], traps:[[/-f BAM( |$)/,'<code>-f BAM</code> treats paired data as single reads and estimates fragment size. For paired-end use <code>BAMPE</code>.']], hint:'macs3 callpeak -t -c -f -g -n --outdir', ans:'macs3 callpeak -t S1_IP.bam -c S1_input.bam -f BAMPE -g hs -n S1 --outdir peaks', why:'For mouse use <code>-g mm</code>.'},
  {t:'cmd', q:'Make a CPM-normalised bigWig <code>S1.bw</code> from <code>S1.dedup.bam</code>, bin size 10, 8 processors.', acc:[has(/^bamCoverage /,/(-b|--bam)[ =]S1\.dedup\.bam/,/(-o|--outFileName)[ =]S1\.bw/,/--normalizeUsing[ =]CPM\b/,/(-bs|--binSize)[ =]10\b/,/(-p|--numberOfProcessors)[ =]8\b/)], hint:'bamCoverage -b -o --normalizeUsing --binSize -p', ans:'bamCoverage -b S1.dedup.bam -o S1.bw --normalizeUsing CPM --binSize 10 -p 8', why:'The BAM must be sorted and indexed (<code>samtools index</code>) first.'},
  {t:'mcq', q:'A transcription-factor ChIP has FRiP = 0.3%. What does it suggest?', opts:['Excellent enrichment','Weak or failed enrichment: few reads fall in peaks','Too many duplicates removed','Normal for histone marks'], a:1, why:'ENCODE flags TF ChIP below ~1% FRiP. Check antibody, the fingerprint plot, and peak count.'}
 ],
 lab:['Run bowtie2 on a test ChIP sample and read the log: what is the overall alignment rate?','Dedup, call peaks with and without the input control, and compare peak counts.','Load the bigWig and narrowPeak file in IGV and look at a known target gene.']

{id:'sc', sec:'Genomics workflows', title:'Single-cell RNA-seq', blurb:'Cell Ranger, Seurat, Scanpy, QC thresholds',
 lessons:[
  {h:'What is in 10x FASTQs', when:'For 10x 3\' gene expression: <b>R1</b> holds the cell barcode (16 bp) + UMI (12 bp), <b>R2</b> holds the cDNA (the actual transcript), <b>I1/I2</b> are sample indexes. Only R2 aligns to the genome; R1 tells you which cell and which molecule.', code:'S1_S1_L001_R1_001.fastq.gz   barcode + UMI\nS1_S1_L001_R2_001.fastq.gz   cDNA\nS1_S1_L001_I1_001.fastq.gz   sample index', watch:'Do not adapter-trim 10x reads with standard tools; Cell Ranger handles them.'},
  {h:'Cell Ranger count', when:'Turns FASTQs into a cell × gene matrix. Heavy: run it as a SLURM job. <code>--id</code> names the output folder, <code>--sample</code> matches the FASTQ prefix. Recent versions (8+) require you to say whether to write a BAM.', code:'cellranger count --id=S1 \\\n  --transcriptome=/refs/refdata-gex-GRCh38-2024-A \\\n  --fastqs=fastq/ --sample=S1 \\\n  --create-bam=true \\\n  --localcores=16 --localmem=64\n# -> S1/outs/web_summary.html\n#    S1/outs/filtered_feature_bc_matrix/', watch:'Open <code>web_summary.html</code> first: estimated cells, median genes per cell, fraction of reads in cells, sequencing saturation.'},
  {h:'Cell QC', when:'Remove empty droplets, damaged cells and likely doublets. Look at three numbers per cell: genes detected (<code>nFeature_RNA</code>), UMIs (<code>nCount_RNA</code>), and percent mitochondrial reads. High %mito = broken or dying cells; very high gene counts can be doublets. Choose thresholds from the violin plots of your own data; tissue matters.', code:'obj <- CreateSeuratObject(Read10X("S1/outs/filtered_feature_bc_matrix"),\n                          min.cells = 3, min.features = 200)\nobj[["percent.mt"]] <- PercentageFeatureSet(obj, pattern = "^MT-")\nVlnPlot(obj, c("nFeature_RNA", "nCount_RNA", "percent.mt"))\nobj <- subset(obj, subset = nFeature_RNA > 200 &\n                            nFeature_RNA < 6000 & percent.mt < 15)', watch:'Mouse mitochondrial genes are lowercase: <code>"^mt-"</code>. A human pattern on mouse data gives 0% everywhere.'},
  {h:'Seurat standard workflow', when:'After QC: normalise, find variable genes, scale, PCA, choose dimensions (ElbowPlot), build the neighbour graph, cluster, embed with UMAP, find marker genes. <code>resolution</code> controls how many clusters you get (higher = more).', code:'obj <- NormalizeData(obj)\nobj <- FindVariableFeatures(obj, nfeatures = 2000)\nobj <- ScaleData(obj)\nobj <- RunPCA(obj)\nElbowPlot(obj)\nobj <- FindNeighbors(obj, dims = 1:20)\nobj <- FindClusters(obj, resolution = 0.5)\nobj <- RunUMAP(obj, dims = 1:20)\nmarkers <- FindAllMarkers(obj, only.pos = TRUE)', watch:'Use the same <code>dims</code> in FindNeighbors and RunUMAP.'},
  {h:'Same steps in Scanpy (Python)', when:'Use Scanpy when your lab works in Python or with very large datasets.', code:'import scanpy as sc\nadata = sc.read_10x_h5("S1/outs/filtered_feature_bc_matrix.h5")\nadata.var["mt"] = adata.var_names.str.startswith("MT-")\nsc.pp.calculate_qc_metrics(adata, qc_vars=["mt"], inplace=True)\nsc.pp.filter_cells(adata, min_genes=200)\nadata = adata[adata.obs.pct_counts_mt < 15].copy()\nsc.pp.normalize_total(adata, target_sum=1e4)\nsc.pp.log1p(adata)\nsc.pp.highly_variable_genes(adata, n_top_genes=2000)\nsc.tl.pca(adata)\nsc.pp.neighbors(adata, n_pcs=20)\nsc.tl.leiden(adata, resolution=0.5)\nsc.tl.umap(adata)', watch:'Doublet detection: scDblFinder (R) or Scrublet (Python), run per sample before merging.'}
 ],
 ex:[
  {t:'mcq', q:'In 10x 3\' data, what is in Read 1?', opts:['The cDNA sequence','The cell barcode and UMI','The sample index','Adapter only'], a:1, why:'R1 tags each read with its cell and molecule; R2 carries the transcript sequence.'},
  {t:'cmd', q:'Run Cell Ranger for sample <code>S1</code>: output id <code>S1</code>, reference <code>/refs/refdata-gex-GRCh38-2024-A</code>, FASTQs in <code>fastq/</code>, and write a BAM.', acc:[has(/^cellranger count /,/--id[ =]S1( |$)/,/--transcriptome[ =]\/refs\/refdata-gex-GRCh38-2024-A\/?( |$)/,/--fastqs[ =]fastq\/?( |$)/,/--sample[ =]S1( |$)/,/--create-bam[ =]true\b/)], traps:[[/^cellranger count (?!.*--create-bam)/,'Cell Ranger 8 and later stop with an error unless you set <code>--create-bam=true</code> or <code>false</code>.']], hint:'cellranger count --id= --transcriptome= --fastqs= --sample= --create-bam=', ans:'cellranger count --id=S1 --transcriptome=/refs/refdata-gex-GRCh38-2024-A --fastqs=fastq/ --sample=S1 --create-bam=true', why:'In a job, add <code>--localcores=$SLURM_CPUS_PER_TASK</code> and <code>--localmem</code> slightly below your <code>--mem</code>.'},
  {t:'mcq', q:'A cluster of cells has 40% mitochondrial reads. Most likely?', opts:['A rare, highly active cell type','Damaged or dying cells whose cytoplasmic RNA leaked out','Doublets','Perfectly healthy cells'], a:1, why:'When the membrane breaks, cytoplasmic mRNA is lost but mitochondrial transcripts stay, so the % rises. (Some tissues like heart muscle naturally run higher; judge per tissue.)'},
  {t:'cmd', ctx:'(R console) Seurat object obj, human data', ps:'>', q:'Add a <code>percent.mt</code> column with the percentage of mitochondrial reads per cell.', acc:[/^obj\[\[(["'])percent\.mt\1\]\] ?<- ?PercentageFeatureSet\(obj, ?pattern ?= ?(["'])\^MT-\2\)$/], traps:[[/\^mt-/,'Lowercase <code>^mt-</code> is mouse. This is human data: <code>^MT-</code>.'],[/pattern ?= ?(["'])MT-/,'Add <code>^</code> so it only matches gene names that START with MT-.']], hint:'obj[["percent.mt"]] <- PercentageFeatureSet(obj, pattern = "...")', ans:'obj[["percent.mt"]] <- PercentageFeatureSet(obj, pattern = "^MT-")', why:'<code>^</code> anchors to the start of the gene name.'},
  {t:'cmd', ctx:'(R console)', ps:'>', q:'Keep cells with more than 200 and fewer than 6000 genes, and under 15% mitochondrial reads.', acc:[has(/^obj ?<- ?subset\(obj, ?subset ?= ?/,/nFeature_RNA ?> ?200\b/,/nFeature_RNA ?< ?6000\b/,/percent\.mt ?< ?15\b/,/\)$/)], traps:[[/ and | && /,'In R, combine conditions in subset() with a single <code>&amp;</code>.']], hint:'subset(obj, subset = A & B & C)', ans:'obj <- subset(obj, subset = nFeature_RNA > 200 & nFeature_RNA < 6000 & percent.mt < 15)', why:'Pick numbers from your own violin plots.'},
  {t:'mcq', q:'You raise <code>FindClusters(resolution = 0.5)</code> to <code>1.2</code>. What happens?', opts:['Fewer, bigger clusters','More, smaller clusters','UMAP becomes sharper','Nothing'], a:1, why:'Higher resolution splits the graph into more communities. Check whether new clusters have distinct markers.'},
  {t:'cmd', ctx:'(Python)', ps:'>>>', q:'With Scanpy, remove cells with fewer than 200 genes from <code>adata</code>.', acc:[/^sc\.pp\.filter_cells\(adata, ?min_genes ?= ?200\)$/], hint:'sc.pp.filter_cells(…, min_genes=…)', ans:'sc.pp.filter_cells(adata, min_genes=200)', why:'Seurat\'s <code>nFeature_RNA &gt; 200</code> in Scanpy terms.'},
  {t:'script', ps:'>', q:'Write the Seurat steps after QC (R): normalise, 2000 variable features, scale, PCA, neighbours on dims 1:20, clusters at resolution 0.5, UMAP on dims 1:20. Keep reassigning to <code>obj</code>.', start:'obj <- NormalizeData(obj)\n', checks:[
     [/NormalizeData\(/,'NormalizeData'],
     [/FindVariableFeatures\([^)]*nfeatures ?= ?2000/,'FindVariableFeatures(…, nfeatures = 2000)'],
     [/ScaleData\(/,'ScaleData'],
     [/RunPCA\(/,'RunPCA'],
     [/FindNeighbors\([^)]*dims ?= ?1:20/,'FindNeighbors(…, dims = 1:20)'],
     [/FindClusters\([^)]*resolution ?= ?0?\.5\b/,'FindClusters(…, resolution = 0.5)'],
     [/RunUMAP\([^)]*dims ?= ?1:20/,'RunUMAP(…, dims = 1:20)'],
     [s=>{const o=['NormalizeData','FindVariableFeatures','ScaleData','RunPCA','FindNeighbors','FindClusters'].map(f=>s.indexOf(f));return o.every(i=>i>=0)&&o.every((v,i)=>i===0||v>o[i-1]);},'Steps in the right order']],
   ans:'obj <- NormalizeData(obj)\nobj <- FindVariableFeatures(obj, nfeatures = 2000)\nobj <- ScaleData(obj)\nobj <- RunPCA(obj)\nobj <- FindNeighbors(obj, dims = 1:20)\nobj <- FindClusters(obj, resolution = 0.5)\nobj <- RunUMAP(obj, dims = 1:20)', why:'Neighbours must exist before clustering; PCA before neighbours. (SCTransform can replace the first three steps.)'}
 ],

const BASES='ACGT';

/* ============================== HELPERS ============================== */
function firstLine(s){return (s.split('\n').find(l=>l.trim()!=='')||'').trim();}
function sbatchBeforeCommands(s){
  const lines=s.split('\n').map(l=>l.trim()).filter(Boolean);
  let seenCmd=false, any=false;
  for(const l of lines){
    if(l.startsWith('#!')) continue;
    if(/^#SBATCH/.test(l)){any=true; if(seenCmd) return false; continue;}
    if(l.startsWith('#')) continue;
    seenCmd=true;
  }
  return any;
}
function norm(s){return s.trim().replace(/\s+/g,' ').replace(/\s*;\s*$/,'');}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function codeHTML(s){
  return s.split('\n').map(l=>{
    let e=esc(l);
    if(/^\s*#(?!!|SBATCH)/.test(l)) return '<span class="c">'+e+'</span>';
    e=e.replace(/^(\$ |&gt; |&gt;&gt;&gt; )/,'<span class="p">$1</span>');
    e=e.replace(/(\s#\s.*)$/,'<span class="c">$1</span>');
    return e;
  }).join('\n');
}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function exId(m,i){return m.id+':'+i;}

function rec(id){return S.done[id]||(S.done[id]={ok:false,tries:0,peek:false,miss:0});}
function markOk(id){const r=rec(id); if(!r.ok){r.ok=true;} r.last=today(); if(r.peek){r.miss=(r.miss||0)+1;} r.peek=false; S.days[today()]=(S.days[today()]||0)+1; save(); renderNav();}
function markTry(id){rec(id).tries++; save();}
function markPeek(id){const r=rec(id); r.peek=true; r.miss=(r.miss||0)+1; save();}

function modProgress(m){return m.ex.filter((e,i)=>S.done[exId(m,i)]&&S.done[exId(m,i)].ok).length;}
function totalEx(){return MODULES.reduce((a,m)=>a+m.ex.length,0);}
function totalDone(){return MODULES.reduce((a,m)=>a+modProgress(m),0);}
function streak(){
  let n=0; const d=new Date();
  if(!S.days[today()]) d.setDate(d.getDate()-1);
  while(true){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if(S.days[k]){n++; d.setDate(d.getDate()-1);} else break;}
  return n;
}

function pickDrill(){
  const all=[]; MODULES.forEach(m=>m.ex.forEach((e,i)=>all.push({m,i,e})));
  const score=x=>{const r=S.done[exId(x.m,x.i)]; if(!r) return 1; if(!r.ok) return 3+(r.tries||0); return (r.miss||0)*2+0.3;};
  // missed/unsolved-but-tried first, then reviews of solved ones, then a few unseen from started modules
  const started=new Set(MODULES.filter(m=>m.ex.some((e,i)=>S.done[exId(m,i)])).map(m=>m.id));
  let pool=all.filter(x=>S.done[exId(x.m,x.i)]||started.has(x.m.id));
  if(pool.length<12) pool=all.filter(x=>MODULES.indexOf(x.m)<=Math.max(1,MODULES.indexOf(nextModule())));
  pool=pool.map(x=>({x,w:score(x)*(0.6+Math.random())})).sort((a,b)=>b.w-a.w).slice(0,12).map(o=>o.x);
  return pool.sort(()=>Math.random()-.5);
}

// Direct call to the Claude API with the user's own key (installed-app mode)
async function apiSample(turns,{signal}){
  const system=turns[0].content; const msgs=[];
  turns.slice(1).forEach(t=>{const last=msgs[msgs.length-1]; if(last&&last.role===t.role) last.content+='\n\n'+t.content; else msgs.push({role:t.role,content:t.content});});
  while(msgs.length&&msgs[0].role!=='user') msgs.shift();
  let r;
  try{
    r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,headers:{'content-type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:1200,system,messages:msgs})});
  }catch(e){ throw {code: e&&e.name==='AbortError'?'cancelled':'upstream_error'}; }
  if(!r.ok){ throw {code: r.status===401||r.status===403?'bad_key':r.status===429?'rate_limited':r.status===400?'bad_request':'upstream_error'}; }
  const j=await r.json();
  const text=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  if(!text) throw {code:'empty_completion'};
  return {text,truncated:j.stop_reason==='max_tokens'};
}

function offlineExplain(it){
  const e=it.e, id=exId(it.m,it.i), a=ATT[id]||[];
  let h='<p><b>Built-in explanation</b> (the AI tutor is off: you are offline, or no API key is set).</p>';
  if(e.t==='cmd'&&a.length){
    const mine=norm(a[a.length-1]).split(' '), want=norm(e.ans).split(' ');
    const missing=want.filter(t=>!mine.includes(t)), extra=mine.filter(t=>!want.includes(t));
    if(missing.length) h+='<p>In the model answer but not yours: '+missing.map(t=>'<code>'+esc(t)+'</code>').join(' ')+'</p>';
    if(extra.length) h+='<p>In yours but not the model answer: '+extra.map(t=>'<code>'+esc(t)+'</code>').join(' ')+'</p>';
    const trap=(e.traps||[]).find(t=>t[0].test(norm(a[a.length-1])));
    if(trap) h+='<p>'+trap[1]+'</p>';
  }
  if(e.hint) h+='<p><b>Hint:</b> '+e.hint+'</p>';
  if(e.why) h+='<p><b>Why:</b> '+e.why+'</p>';
  return h;
}
function mdHTML(t){
  const parts=String(t).split(/```[a-zA-Z]*\n?/);
  return parts.map((p,i)=>{
    if(i%2) return '<pre class="code">'+esc(p.replace(/\n$/,''))+'</pre>';
    return esc(p).split(/\n{2,}/).map(par=>{
      par=par.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
      const lines=par.split('\n');
      if(lines.every(l=>/^\s*([-*]|\d+\.)\s/.test(l)||!l.trim())) return '<ul>'+lines.filter(l=>l.trim()).map(l=>'<li>'+l.replace(/^\s*([-*]|\d+\.)\s/,'')+'</li>').join('')+'</ul>';
      return par.trim()?'<p>'+lines.join('<br>')+'</p>':'';
    }).join('');
  }).join('');
}
const ERR_COPY={bad_key:'Your API key was not accepted. Check it in the "AI tutor" settings on the Today page.',bad_request:'The request was rejected. Try a shorter question.',not_granted:'The tutor is off for this visit because Claude access was not allowed. Reload the page to be asked again.',sampling_disabled:'Claude is not available on this account, so the tutor is off.',rate_limited:'Too many questions in a short time. Wait a minute and ask again.',session_expired:'Your Claude session expired. Sign in again, then ask.',refused:'The tutor could not answer that. Try rephrasing the question.',empty_completion:'No answer came back. Try a shorter question.',prompt_too_large:'That was too long. Paste a shorter piece.'};
function mountTutor(el,key,ctxFn,quick,offlineFn){
  if(!el) return;
  const hist=THIST[key]=THIST[key]||[];
  el.innerHTML='<div class="tutor-head"><span class="tutor-name">Ask the tutor</span><span class="tutor-status small-note">checking…</span></div>'+
    '<div class="tlog"></div>'+
    '<div class="quick">'+quick.map(q=>'<button class="chip" type="button">'+esc(q)+'</button>').join('')+'</div>'+
    '<div class="tin"><textarea rows="2" id="tq-'+key.replace(/\W/g,'_')+'" placeholder="Ask anything about this: why, when, what a flag does, paste an error…" aria-label="Question for the tutor"></textarea><div class="row"><button class="btn primary small" data-ask>Ask</button><button class="btn small" data-stop hidden>Stop</button></div></div>';
  const log=el.querySelector('.tlog'), ta=el.querySelector('textarea'), askB=el.querySelector('[data-ask]'), stopB=el.querySelector('[data-stop]'), st=el.querySelector('.tutor-status');
  const drawHist=()=>{log.innerHTML=hist.map(t=>t.role==='user'?'<div class="msg you"><span class="who">You</span><div>'+esc(t.content)+'</div></div>':'<div class="msg ai"><span class="who">Tutor</span><div>'+mdHTML(t.content)+'</div></div>').join('');};
  drawHist();
  let sample=null, ctl=null;
  const label=()=>{const m=tutorMode(sample); st.textContent=m==='claude'?'AI · uses your Claude account':m==='api'?'AI · uses your API key':(navigator.onLine&&!getKey()&&!sample?'Built-in explanations · add an API key on Today to turn on AI':'Offline · built-in explanations');};
  samplerP.then(s=>{sample=s; label();});
  addEventListener('online',label); addEventListener('offline',label);
  const ask=async(q)=>{
    q=q.trim(); if(!q) return;
    const mode=tutorMode(sample);
    if(mode==='off'){
      const box=document.createElement('div'); box.className='msg ai';
      box.innerHTML='<span class="who">Tutor (offline)</span><div>'+(offlineFn?offlineFn():'<p>The AI tutor needs an internet connection inside Claude. Re-read the "Use it when" and "Watch out" notes above; they cover the most common confusions.</p>')+'</div>';
      log.appendChild(box); return;
    }
    hist.push({role:'user',content:q}); ta.value=''; drawHist();
    const out=document.createElement('div'); out.className='msg ai'; out.innerHTML='<span class="who">Tutor</span><div class="small-note">Thinking…</div>'; log.appendChild(out);
    const body=out.querySelector('div');
    ctl=new AbortController(); askB.disabled=true; stopB.hidden=false;
    const turns=[{role:'user',content:TUTOR_RULES+'\n\n--- Current context ---\n'+ctxFn()},...hist.slice(-8)];
    try{
      const {text,truncated}=mode==='claude'
        ? await sample(turns,{cache:false,modelTier:'default',signal:ctl.signal,onText:({text})=>{body.innerHTML=mdHTML(text);}})
        : await apiSample(turns,{signal:ctl.signal});
      body.innerHTML=mdHTML(text)+(truncated?'<p class="small-note">Answer was cut short. Ask a narrower question.</p>':'');
      hist.push({role:'assistant',content:text});
    }catch(err){
      const code=err&&err.code;
      if(code==='cancelled'){ if(err.text){body.innerHTML=mdHTML(err.text); hist.push({role:'assistant',content:err.text});} else {out.remove(); hist.pop();} }
      else{
        if(err&&err.text) body.innerHTML=mdHTML(err.text); else body.innerHTML='';
        body.insertAdjacentHTML('beforeend','<p class="small-note">'+(ERR_COPY[code]||'Connection problem. Check your internet and ask again.')+'</p>');
        if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){tutorBlocked=true; label();}
        if(!err||!err.text) hist.pop();
      }
    }finally{askB.disabled=false; stopB.hidden=true; ctl=null;}
  };
  askB.onclick=()=>ask(ta.value);
  stopB.onclick=()=>ctl&&ctl.abort();
  ta.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();ask(ta.value);}});
  el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    if(/paste it below/.test(c.textContent)){ta.focus(); ta.placeholder='Paste the error message here, then press Ask'; return;}
    ask(c.textContent);
  });
}

/* ============================== PRACTICE ENGINE ============================== */
function mountPractice(host,items,start,onChange,isDrill){
  let idx=start; let tries=0;
  function draw(){
    const it=items[idx]; const id=exId(it.m,it.i); const e=it.e; const r=S.done[id];
    tries=0;
    const strip=items.map((x,j)=>{const ok=S.done[exId(x.m,x.i)]&&S.done[exId(x.m,x.i)].ok; const b=BASES[j%4]; return '<button class="'+b+(ok?' done':'')+(j===idx?' cur':'')+'" data-j="'+j+'" aria-label="Exercise '+(j+1)+(ok?' solved':'')+'">'+(ok?b:'N')+'</button>';}).join('');
    const kind={cmd:'Type the command',mcq:'Choose one',script:'Write the script'}[e.t];
    let h='<div class="prac"><div class="prac-head"><div class="strip">'+strip+'</div><span class="small-note">'+(isDrill?esc(it.m.title)+' · ':'')+(idx+1)+' of '+items.length+(r&&r.ok?' · solved before':'')+'</span></div><div class="prac-body">';
    h+='<div class="kind">'+kind+'</div><p class="q">'+e.q+'</p>';
    if(e.t==='cmd'){
      h+='<div class="term">'+(e.ctx?'<div class="ctx">'+esc(e.ctx)+'</div>':'')+'<div class="line"><span class="ps">'+esc(e.ps||'$')+'</span><input id="cmdIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your command" placeholder="type here, press Enter"></div></div>';
    } else if(e.t==='mcq'){
      h+='<div class="opts">'+e.opts.map((o,k)=>'<button class="opt" data-k="'+k+'">'+o+'</button>').join('')+'</div>';
    } else {
      h+='<textarea class="script" id="scrIn" spellcheck="false" autocapitalize="off" aria-label="Your script">'+esc(e.start||'')+'</textarea><ul class="checks" id="checks" hidden></ul>';
    }
    h+='<div id="fb"></div><div class="prac-foot"><div class="row">'+(e.t!=='mcq'?'<button class="btn primary" id="check">Check</button><button class="btn" id="hint">Hint</button>':'')+'<button class="btn" id="show">Show answer</button></div><div class="row"><button class="btn" id="prev" '+(idx===0?'disabled':'')+'>← Prev</button><button class="btn" id="next">'+(idx===items.length-1?'Finish':'Next →')+'</button></div></div>';
    h+='</div><section class="tutor" aria-label="AI tutor"></section></div>';
    host.innerHTML=h;
    mountTutor(host.querySelector('.tutor'), id, ()=>practiceContext(it,host), [
      'Why is my answer not accepted?',
      'Break the answer down part by part',
      'When would I use this in a real lab project?'
    ], ()=>offlineExplain(it));
    const fb=host.querySelector('#fb');
    host.querySelectorAll('.strip button').forEach(b=>b.onclick=()=>{idx=+b.dataset.j;draw();});
    host.querySelector('#prev').onclick=()=>{if(idx>0){idx--;draw();}};
    host.querySelector('#next').onclick=()=>{
      if(idx<items.length-1){idx++;draw();}
      else { const solved=items.filter(x=>S.done[exId(x.m,x.i)]&&S.done[exId(x.m,x.i)].ok).length; fb.innerHTML='<div class="fb ok"><p><b>Set finished: '+solved+' of '+items.length+' solved.</b> '+(isDrill?'Shuffle a new set, or move on to your module.':'Now open the Real-terminal lab tab and try it for real.')+'</p></div>'; }
    };
    const showAns=()=>{
      markPeek(id);
      const a=e.t==='mcq'?e.opts[e.a]:e.ans;
      fb.innerHTML='<div class="fb show"><p><b>Answer</b></p>'+(e.t==='mcq'?'<p>'+a+'</p>':'<pre class="code">'+codeHTML(a)+'</pre>')+(e.why?'<p>'+e.why+'</p>':'')+'<p class="small-note">Now type it yourself from memory. It counts once you get it right.</p></div>';
      if(e.t==='mcq') host.querySelectorAll('.opt').forEach((b,k)=>{if(k===e.a)b.classList.add('right');});
    };
    host.querySelector('#show').onclick=showAns;

    if(e.t==='cmd'){
      const inp=host.querySelector('#cmdIn'); setTimeout(()=>inp.focus({preventScroll:true}),0);
      const check=()=>{
        const v=norm(inp.value); if(!v) return;
        tries++; markTry(id);
        logAttempt(id,inp.value);
        if(e.acc.some(a=>typeof a==='function'?a(v):a.test(v))){ markOk(id); good(e.why, v!==e.ans?e.ans:null); return; }
        const trap=(e.traps||[]).find(t=>t[0].test(v));
        fb.innerHTML='<div class="fb no"><p><b>Not yet.</b> '+(trap?trap[1]:'Check spelling, spaces, and the file names in the question.')+'</p>'+(tries>=2&&!trap?'<p class="small-note">Stuck? Try the hint, or show the answer and retype it.</p>':'')+'</div>';
      };
      inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();check();}});
      host.querySelector('#check').onclick=check;
      host.querySelector('#hint').onclick=()=>{fb.innerHTML='<div class="fb hint"><p><b>Hint:</b> '+e.hint+'</p></div>';inp.focus();};
    } else if(e.t==='mcq'){
      host.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
        const k=+b.dataset.k; markTry(id); logAttempt(id,'chose: '+strip(e.opts[k]));
        if(k===e.a){ b.classList.add('right'); markOk(id); good(e.why); }
        else { b.classList.add('wrong'); fb.innerHTML='<div class="fb no"><p><b>Not that one.</b> Try another.</p></div>'; }
      });
    } else {
      const ta=host.querySelector('#scrIn'); const ul=host.querySelector('#checks');
      ta.addEventListener('keydown',ev=>{ if(ev.key==='Tab'){ev.preventDefault(); const s=ta.selectionStart; ta.setRangeText('  ',s,ta.selectionEnd,'end');} });
      host.querySelector('#check').onclick=()=>{
        const v=ta.value; markTry(id); logAttempt(id,v);
        const res=e.checks.map(c=>({ok:typeof c[0]==='function'?c[0](v):c[0].test(v),msg:c[1]}));
        ul.hidden=false; ul.innerHTML=res.map(r=>'<li class="'+(r.ok?'pass':'')+'">'+esc(r.msg)+'</li>').join('');
        const n=res.filter(r=>r.ok).length;
        if(n===res.length){ markOk(id); good(e.why); }
        else fb.innerHTML='<div class="fb no"><p><b>'+n+' of '+res.length+' checks pass.</b> Fix the ✗ lines and check again.</p></div>';
      };
      host.querySelector('#hint').onclick=()=>{ul.hidden=false; ul.innerHTML=e.checks.map(c=>'<li>'+esc(c[1])+'</li>').join(''); fb.innerHTML='<div class="fb hint"><p><b>Hint:</b> your script needs everything in the list above.</p></div>';};
    }
    function good(why,alt){
      fb.innerHTML='<div class="fb ok"><p><b>Correct.</b> '+(why||'')+'</p>'+(alt?'<p class="small-note">The most common way to write it: <code>'+esc(alt)+'</code></p>':'')+'</div>';
      host.querySelectorAll('.strip button')[idx].classList.add('done');
      host.querySelectorAll('.strip button')[idx].textContent=BASES[idx%4];
      const nx=host.querySelector('#next'); nx.classList.add('primary'); nx.focus({preventScroll:true});
    }
  }
  draw();
}

  const inst=document.getElementById('installNote'); if(!inst) return;

  inst.innerHTML=standalone?'Installed. Lessons, exercises, drill and cheat sheet all work offline; progress stays on this device.'

  const kb=document.getElementById('keyBox'), ki=document.getElementById('apiKey'), msg=document.getElementById('keyMsg');
  samplerP.then(s=>{ if(s){ kb.innerHTML='<p>You are inside Claude, so the tutor uses your Claude account. No key needed here.</p>'; } });
  if(getKey()){ ki.placeholder='Key saved on this device'; msg.textContent='A key is saved. The tutor will use it when you are online.'; }

  document.getElementById('clearKey').onclick=()=>{ setKey(''); ki.value=''; ki.placeholder='sk-ant-…'; msg.textContent='Key removed from this device.'; };
}
